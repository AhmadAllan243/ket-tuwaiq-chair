/* ===================== TOKENS (same as ket-product.html) ===================== */
:root{
  --white:#fff; --black:#000; --g400:#A8A8A8; --g200:#DCDCDC; --g100:#F4F4F4; --page:#F2F2F4;
  --ink-2:#555;

  --blush:#FCDFDB; --rose:#F5BDB4; --green:#02A27A;
  --f-latin:'Inter Tight', system-ui, sans-serif;
  --f-ar:'IBM Plex Sans Arabic', 'Inter Tight', system-ui, sans-serif;
  --font:var(--f-ar);
  --t-xs:12px; --t-sm:14px; --t-base:16px;
  --t-lg:clamp(22px, 2.4vw, 28px);
  --t-xl:clamp(32px, 4.6vw, 60px);
  --ls-caps:-0.02em; --ls-label:.08em;
  --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px;
  --gutter:16px; --section:clamp(64px, 9vw, 128px);
  --r-card:24px; --r-pill:999px;
  --ease:cubic-bezier(.16,1,.3,1);
  --header-h:60px; --dir:-1;
}
html[dir="ltr"]{ --dir:1; --font:var(--f-latin); }
html[lang="ar"]{ --ls-caps:0; --ls-label:0; }
@media (min-width:768px){ :root{ --gutter:32px; } }
@media (min-width:1200px){ :root{ --gutter:48px; --header-h:72px; } }

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; overflow-x:clip; }
body{ margin:0; background:var(--page); color:var(--black); font-family:var(--font); font-size:var(--t-base); line-height:1.6; overflow-x:clip; -webkit-font-smoothing:antialiased; }
img{ display:block; max-width:100%; height:auto; }
button, select{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
a{ color:inherit; }
svg{ display:block; }
h1,h2,h3,p{ margin:0; }
ul{ margin:0; padding:0; list-style:none; }
.num, .latin{ font-family:var(--f-latin); }
.visually-hidden{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:focus-visible{ outline:2px solid var(--black); outline-offset:3px; border-radius:6px; }
.skip{ position:fixed; inset-inline-start:12px; top:-60px; z-index:300; background:#000; color:#fff; padding:10px 16px; border-radius:var(--r-pill); text-decoration:none; transition:top .3s var(--ease); }
.skip:focus{ top:12px; }
.container{ width:100%; max-width:1440px; margin-inline:auto; padding-inline:var(--gutter); }
.section{ padding-block:var(--section) 0; }
.h-xl{ font-size:var(--t-xl); font-weight:600; line-height:1.02; letter-spacing:-.03em; text-wrap:balance; }
html[lang="ar"] .h-xl{ font-weight:700; line-height:1.25; letter-spacing:0; }
.eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:var(--t-xs); font-weight:600; text-transform:uppercase; letter-spacing:var(--ls-label); }
html[lang="ar"] .eyebrow{ font-size:13px; text-transform:none; }
.eyebrow::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--black); }
.eyebrow--o::before{ background:var(--rose); }
.muted{ color:var(--ink-2); }
.line-mask{ display:block; overflow:hidden; padding-block:.06em; }
.line-mask > span{ display:block; }

.pill{ display:inline-flex; align-items:center; gap:6px; height:32px; padding-inline:12px; border-radius:var(--r-pill); font-size:13px; font-weight:500; white-space:nowrap; background:var(--white); }
.pill svg{ flex:none; }
.btn{ position:relative; display:inline-flex; align-items:center; justify-content:center; gap:12px; height:52px; padding-inline:22px 8px; border-radius:var(--r-pill); font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; isolation:isolate; text-decoration:none; }
.btn-primary{ background:var(--black); color:var(--white); }
.btn-primary::before{ content:""; position:absolute; inset:0; background:#262626; transform:translateY(101%); transition:transform .5s var(--ease); z-index:-1; }
.btn-primary:hover::before{ transform:none; }
.btn .arr{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--white); color:var(--black); transition:transform .5s var(--ease); }
.btn:hover .arr{ transform:rotate(calc(-45deg * var(--dir) * -1)); }
html[dir="rtl"] .arr svg, html[dir="rtl"] .flip svg{ transform:scaleX(-1); }
.icon-btn{ display:inline-grid; place-items:center; width:44px; height:44px; border-radius:var(--r-pill); transition:background-color .25s; }
.icon-btn:hover{ background:var(--g100); }
.circ{ display:inline-grid; place-items:center; width:44px; height:44px; border-radius:50%; background:var(--rose); color:var(--black); flex:none; transition:transform .5s var(--ease), background-color .3s; }

/* ===================== LOADER (ring of tables around the logo) ===================== */
.loader{ position:fixed; inset:0; z-index:200; background:var(--white); display:grid; place-items:center; overflow:hidden; }
.no-motion .loader{ display:none; }
.loader__dots{ position:absolute; display:flex; gap:7px; }
.loader__dots i{ width:9px; height:9px; border-radius:50%; background:var(--black); animation:dot 1s var(--ease) infinite; }
.loader__dots i:nth-child(2){ animation-delay:.12s; } .loader__dots i:nth-child(3){ animation-delay:.24s; }
@keyframes dot{ 0%,100%{ transform:translateY(0); opacity:.35; } 40%{ transform:translateY(-7px); opacity:1; } }
.loader__line{ position:absolute; font-size:clamp(20px, 3vw, 30px); font-weight:500; letter-spacing:-.02em; opacity:0; white-space:nowrap; color:#3a3a3a; }
.loader__logo{ position:absolute; opacity:0; color:var(--black); }
.loader__logo svg{ width:clamp(96px, 14vw, 150px); height:auto; }
.ring{ position:absolute; inset:0; pointer-events:none; }
.ring__t{ position:absolute; left:50%; top:50%; width:var(--ts); height:var(--ts); margin:calc(var(--ts) / -2) 0 0 calc(var(--ts) / -2); background:var(--bg); overflow:hidden; opacity:0; will-change:transform; }
.ring__t img{ width:100%; height:100%; object-fit:contain; mix-blend-mode:multiply; padding:10%; }
.ring__t.is-photo img{ object-fit:cover; padding:0; mix-blend-mode:normal; }
.sh-circle{ border-radius:50%; } .sh-arch{ border-radius:999px 999px 18px 18px; height:calc(var(--ts) * 1.18)!important; } .sh-sq{ border-radius:22px; } .sh-pill{ border-radius:999px; width:calc(var(--ts) * .78)!important; height:calc(var(--ts) * 1.12)!important; }
.loader__skip{ position:absolute; bottom:calc(20px + env(safe-area-inset-bottom)); inset-inline-end:20px; font-size:13px; font-weight:600; padding:8px 14px; border-radius:var(--r-pill); border:1px solid var(--g200); opacity:.75; }
.loader__skip:hover{ opacity:1; background:var(--g100); }
html.is-loading body{ overflow:hidden; }

/* ===================== ANNOUNCEMENT + HEADER ===================== */
.announce{ position:relative; z-index:61; background:var(--blush); height:36px; overflow:hidden; display:flex; align-items:center; font-size:13px; font-weight:500; }
.marquee{ display:flex; width:max-content; animation:marquee 32s linear infinite; }
.marquee__group{ display:flex; align-items:center; gap:28px; padding-inline-end:28px; white-space:nowrap; }
.marquee__group span{ display:inline-flex; align-items:center; gap:28px; }
.marquee__group span::after{ content:""; width:5px; height:5px; border-radius:50%; background:var(--black); }
@keyframes marquee{ to{ transform:translateX(calc(50% * var(--dir) * -1)); } }
.header{ position:sticky; top:0; z-index:60; background:var(--white); border-bottom:1px solid transparent; transition:border-color .35s; }
.header.is-scrolled{ border-bottom-color:var(--g200); }
.header__inner{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; height:var(--header-h); transition:height .4s var(--ease); }
.header.is-scrolled .header__inner{ height:52px; }
.header__start, .header__end{ display:flex; align-items:center; gap:2px; }
.header__end{ justify-content:flex-end; }
.logo{ display:block; color:var(--black); text-decoration:none; }
.logo svg{ width:64px; height:auto; overflow:visible; transition:width .4s var(--ease); }
.header.is-scrolled .logo svg{ width:58px; }
.klogo .kl{ transform-box:fill-box; transform-origin:50% 100%; transition:transform .6s var(--ease), opacity .35s var(--ease); }
.klogo .kl:nth-child(2){ transition-delay:.05s; } .klogo .kl:nth-child(3){ transition-delay:.1s; }
.klogo__smile{ transform-box:fill-box; transform-origin:50% 50%; opacity:0; clip-path:inset(0 50% 0 50%); transform:translateY(-10%) scale(.7); transition:clip-path .55s var(--ease), opacity .25s, transform .6s var(--ease); }
.header.is-scrolled .klogo .kl{ transform:translateY(10%) scale(.2, .04); opacity:0; }
.header.is-scrolled .klogo .klogo__smile{ opacity:1; clip-path:inset(0 0 0 0); transform:translateY(-34%) scale(1.18); transition-delay:.18s; }
.lang-btn{ height:36px; padding-inline:14px; border-radius:var(--r-pill); border:1px solid var(--black); font-size:13px; font-weight:600; margin-inline-start:6px; transition:background-color .25s,color .25s; }
.lang-btn:hover{ background:var(--black); color:var(--white); }
.cart-btn{ position:relative; }
.cart-count{ position:absolute; top:4px; inset-inline-end:2px; min-width:18px; height:18px; padding-inline:5px; border-radius:var(--r-pill); background:var(--rose); color:#000; font:600 11px/18px var(--f-latin); text-align:center; transform:scale(0); transition:transform .4s var(--ease); }
.cart-count.has-items{ transform:scale(1); }
.cart-count.bump{ animation:bump .5s var(--ease); }
@keyframes bump{ 40%{ transform:scale(1.45); } }
.crumbs{ font-size:13px; color:var(--ink-2); display:none; gap:8px; }
.crumbs a{ text-decoration:none; } .crumbs a:hover{ color:#000; }
@media (min-width:1024px){ .crumbs{ display:flex; } }
@media (max-width:1023px){ .hide-mob{ display:none!important; } }

/* ===================== 1. BANNER (pink + white only: white word, the TM table inside a 3D ring, white ribbon) ===================== */
.banner{ padding-top:12px; }
.bn{ --ch:clamp(640px, calc(100svh - var(--header-h) - 36px - 24px), 940px); --th:calc(var(--ch) * .6);
  --rose-d:#B5574F; --rose-ink:#8F433E;
  position:relative; height:var(--ch); border-radius:var(--r-card); overflow:hidden; isolation:isolate; color:var(--rose-ink);
  background:radial-gradient(42% 40% at 50% 78%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 70%), radial-gradient(120% 90% at 50% 0%, #FBE0DB 0%, var(--blush) 50%, #F7CBC4 100%); }
.bn__nav{ position:absolute; z-index:6; top:clamp(14px, 2vw, 24px); inset-inline:clamp(14px, 2vw, 24px); display:flex; justify-content:center; gap:6px; }
.bn__nav a{ height:32px; padding-inline:14px; display:inline-flex; align-items:center; border-radius:var(--r-pill); background:rgba(255,255,255,.5); color:var(--rose-ink); font-size:13px; font-weight:500; text-decoration:none; transition:background-color .3s; }
.bn__nav a:hover{ background:var(--white); }
.bn__all{ position:absolute; z-index:6; top:clamp(14px, 2vw, 24px); inset-inline-end:clamp(14px, 2vw, 24px); display:inline-flex; align-items:center; gap:8px; height:36px; padding-inline:4px 14px; border-radius:var(--r-pill); background:var(--white); color:var(--rose-ink); font-size:13px; font-weight:600; text-decoration:none; }
.bn__all i, .bn__cta i, .bn__prod i{ width:28px; height:28px; flex:none; border-radius:50%; background:var(--rose-d); color:var(--white); display:grid; place-items:center; transition:transform .5s var(--ease); }
.bn__all:hover i, .bn__cta:hover i, .bn__prod:hover i{ transform:rotate(calc(-45deg * var(--dir) * -1)); }
/* the white word sits behind the table */
.bn__word{ position:absolute; inset-inline:0; top:calc(var(--ch) * .08); text-align:center; color:var(--white); font-weight:800; font-size:clamp(130px, 19vw, 320px); line-height:.86; letter-spacing:-.065em; white-space:nowrap; pointer-events:none; }
html[lang="ar"] .bn__word{ font-weight:700; letter-spacing:0; line-height:1.05; font-size:clamp(120px, 16vw, 270px); }
.bn__word .ch{ display:inline-block; }
.bn__wordwrap{ overflow:hidden; display:inline-block; padding:.12em .06em 0; }
/* stage: back half of the ring → floor glow → table → front half → bubbles (z by depth) */
.bn__stage{ position:absolute; left:50%; bottom:calc(var(--ch) * .15); width:min(100%, calc(var(--th) * 1.7)); height:var(--th); transform:translateX(-50%); }
.bn__ring{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
.bn__ring--back{ z-index:1; } .bn__ring--front{ z-index:3; }
.bn__floor{ position:absolute; z-index:1; left:50%; bottom:-4%; width:calc(var(--th) * .95); height:calc(var(--th) * .16); transform:translateX(-50%); border-radius:50%; background:radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)); }
.bn__floor::after{ content:""; position:absolute; left:50%; top:30%; width:44%; height:34%; transform:translateX(-50%); border-radius:50%; background:radial-gradient(closest-side, rgba(181,87,79,.32), rgba(181,87,79,0)); filter:blur(4px); }
.bn__table{ position:absolute; z-index:2; left:50%; bottom:0; height:100%; transform:translateX(-50%); will-change:transform; }
.bn__table img{ height:100%; width:auto; filter:drop-shadow(0 30px 40px rgba(181,87,79,.22)); }
.bn__b{ position:absolute; left:0; top:0; width:clamp(84px, 7.4vw, 112px); aspect-ratio:1; will-change:transform; }
.bn__bi{ width:100%; height:100%; border-radius:50%; background:var(--white); display:grid; place-content:center; text-align:center; gap:2px; box-shadow:0 14px 34px rgba(181,87,79,.16); }
.bn__bi b{ font:700 clamp(20px, 2vw, 28px)/1 var(--f-latin); letter-spacing:-.04em; color:var(--rose-d); }
.bn__bi span{ font-size:11px; line-height:1.25; color:var(--rose-ink); padding-inline:8px; }
.bn__spark{ position:absolute; z-index:4; color:var(--white); animation:twinkle 3.2s ease-in-out infinite; pointer-events:none; }
.bn__spark:nth-of-type(2){ animation-delay:-1s; } .bn__spark:nth-of-type(3){ animation-delay:-2.1s; } .bn__spark:nth-of-type(4){ animation-delay:-.5s; }
@keyframes twinkle{ 0%,100%{ transform:scale(.5) rotate(0); opacity:.3; } 50%{ transform:scale(1) rotate(45deg); opacity:1; } }
/* headline on the start side, product + button on the end side */
.bn__copy{ position:absolute; z-index:5; inset-inline-start:clamp(20px, 5vw, 80px); top:calc(var(--ch) * .44); width:min(400px, 30vw); }
.bn__copy h1{ font-weight:800; font-size:clamp(40px, 4.6vw, 76px); line-height:.9; letter-spacing:-.045em; text-transform:uppercase; color:var(--rose-d); }
html[lang="ar"] .bn__copy h1{ font-weight:700; line-height:1.15; letter-spacing:0; font-size:clamp(38px, 4vw, 64px); }
.bn__copy h1 .line-mask:first-child{ color:var(--white); }
.bn__copy .line-mask > span{ display:inline-block; }
.bn__side{ position:absolute; z-index:5; inset-inline-end:clamp(20px, 5vw, 80px); top:calc(var(--ch) * .46); width:min(300px, 24vw); display:grid; gap:14px; justify-items:start; }
.bn__side p{ font-size:15px; line-height:1.65; color:var(--rose-ink); }
.bn__prod{ display:flex; align-items:center; gap:12px; width:100%; padding:8px; padding-inline-end:12px; border-radius:20px; background:rgba(255,255,255,.75); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); color:var(--rose-ink); text-decoration:none; box-shadow:0 14px 34px rgba(181,87,79,.12); transition:background-color .3s; }
.bn__prod:hover{ background:var(--white); }
.bn__prod img{ width:52px; height:52px; border-radius:14px; background:var(--blush); object-fit:contain; padding:4px; flex:none; }
.bn__prod span{ flex:1; min-width:0; display:grid; gap:2px; }
.bn__prod b{ font-size:14px; font-weight:600; line-height:1.3; }
.bn__prod em{ font-style:normal; font-family:var(--f-latin); font-size:15px; font-weight:600; color:var(--rose-d); }
.bn__prod em small{ font-family:var(--f-ar); font-size:11px; font-weight:500; margin-inline-start:3px; }
.bn__prod em s{ font-size:12px; font-weight:400; color:#C99A95; margin-inline-start:6px; }
.bn__cta{ display:inline-flex; align-items:center; gap:8px; height:40px; padding-inline:4px 16px; border-radius:var(--r-pill); background:var(--white); color:var(--rose-ink); font-size:13px; font-weight:600; text-decoration:none; }
/* white ribbon across the bottom, text in deep pink */
.bn__ribbon{ position:absolute; z-index:5; inset-inline:0; bottom:0; pointer-events:none; }
.bn__ribbon svg{ width:100%; height:auto; overflow:visible; direction:ltr; }   /* ltr keeps Arabic on the path (it still joins) */
.bn__ribbon text{ font-family:var(--f-latin); font-weight:800; fill:var(--rose-d); letter-spacing:.02em; }
html[lang="ar"] .bn__ribbon text{ font-family:var(--f-ar); font-weight:700; letter-spacing:0; }
@media (max-width:1023px){
  .bn__nav{ display:none; }
  .bn{ --ch:860px; --th:330px; }
  .bn__word{ top:60px; font-size:min(30vw, 230px); }
  html[lang="ar"] .bn__word{ font-size:min(26vw, 200px); }
  .bn__all{ inset-inline-start:14px; inset-inline-end:auto; }
  .bn__stage{ top:118px; bottom:auto; width:100%; }
  .bn__copy{ inset-inline:20px; width:auto; top:478px; text-align:center; }
  .bn__copy h1{ font-size:min(11vw, 64px); }
  html[lang="ar"] .bn__copy h1{ font-size:min(10vw, 58px); }
  .bn__side{ inset-inline:20px; width:auto; top:640px; justify-items:center; text-align:center; }
  .bn__side p{ display:none; }
  .bn__prod{ max-width:340px; text-align:start; }
  .bn__b{ width:70px; }
  .bn__bi b{ font-size:17px; }
  .bn__bi span{ font-size:10px; padding-inline:6px; }
}

/* ===================== 2. INTRO BENTO ===================== */
.intro__grid{ display:grid; gap:16px; }
@media (min-width:1024px){ .intro__grid{ grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:24px; align-items:stretch; } }
.intro__left{ display:grid; align-content:start; gap:var(--s5); padding:clamp(8px, 2vw, 24px) 0; }
.intro__h{ font-size:clamp(32px, 4vw, 54px); font-weight:500; line-height:1.08; letter-spacing:-.035em; text-wrap:balance; }
html[lang="ar"] .intro__h{ font-weight:600; line-height:1.4; letter-spacing:0; }
.ipill{ display:inline-block; vertical-align:middle; width:1.9em; height:.95em; border-radius:999px; overflow:hidden; margin-inline:.12em; background:var(--blush); position:relative; top:-.06em; }
.ipill img{ width:100%; height:100%; object-fit:cover; }
.ipill--cut img{ object-fit:contain; mix-blend-mode:multiply; padding:2px; transform:scale(1.25); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.acc{ display:grid; gap:10px; margin-top:var(--s3); }
.acc__item{ background:var(--white); border-radius:18px; overflow:hidden; }
.acc__btn{ width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 20px; font-weight:500; font-size:16px; text-align:start; }
.acc__btn .pm{ position:relative; width:14px; height:14px; flex:none; }
.acc__btn .pm::before, .acc__btn .pm::after{ content:""; position:absolute; left:0; top:6px; width:14px; height:1.6px; background:currentColor; transition:transform .4s var(--ease); }
.acc__btn .pm::after{ transform:rotate(90deg); }
.acc__btn[aria-expanded="true"] .pm::after{ transform:rotate(0); }
.acc__panel{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .5s var(--ease); }
.acc__panel > div{ overflow:hidden; }
.acc__panel p{ padding:0 20px 18px; font-size:14px; line-height:1.7; color:var(--ink-2); max-width:52ch; }
.acc__btn[aria-expanded="true"] + .acc__panel{ grid-template-rows:1fr; }
.intro__card{ background:var(--white); border-radius:var(--r-card); padding:clamp(20px, 2.4vw, 32px); display:grid; gap:20px; }
@media (min-width:640px){ .intro__card{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
.intro__copy{ display:flex; flex-direction:column; gap:14px; }
.intro__copy .eyebrow::before{ background:var(--rose); }
.intro__copy p{ font-size:14px; color:var(--ink-2); max-width:30ch; }
.intro__copy h3{ margin-top:auto; font-size:clamp(26px, 2.6vw, 36px); font-weight:500; line-height:1.1; letter-spacing:-.03em; white-space:pre-line; }
html[lang="ar"] .intro__copy h3{ font-weight:600; line-height:1.4; letter-spacing:0; }
.intro__copy .btn{ align-self:flex-start; }
.photo{ position:relative; border-radius:20px; overflow:hidden; min-height:340px; background:#e9e7e4; }
.photo > img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(1.08); }
.photo .tag{ position:absolute; top:12px; inset-inline-end:12px; }
.stat{ position:absolute; inset-inline:14px; bottom:14px; background:rgba(255,255,255,.95); border-radius:18px; padding:14px; display:grid; gap:10px; }
.stat__row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.stat__big{ font:600 28px/1 var(--f-latin); letter-spacing:-.03em; }
.stat__lbl{ font-size:12px; color:var(--ink-2); }
.stat__foot{ display:flex; align-items:center; gap:10px; padding-top:10px; border-top:1px solid var(--g200); }
.stack{ display:flex; direction:ltr; }
.stack span{ width:34px; height:34px; border-radius:50%; border:2px solid var(--white); background:var(--blush); overflow:hidden; margin-left:-10px; }
.stack span:first-child{ margin-left:0; }
.stack img{ width:100%; height:100%; object-fit:contain; mix-blend-mode:multiply; padding:3px; }

/* ===================== 3. PICK THE SHAPE (bento: white product tiles, stat card, big photo card) ===================== */
.shape{ display:grid; gap:12px; }
.shape__cols{ display:grid; grid-auto-flow:column; grid-auto-columns:43vw; gap:10px; overflow-x:auto; scrollbar-width:none; margin-inline:calc(var(--gutter) * -1); padding-inline:var(--gutter); scroll-snap-type:x proximity; }
.shape__cols::-webkit-scrollbar{ display:none; }
.sc{ display:flex; flex-direction:column; gap:10px; min-width:0; scroll-snap-align:start; }
.st{ position:relative; display:block; border-radius:22px; background:var(--white); overflow:hidden; text-align:start; text-decoration:none; isolation:isolate; }
.st img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:6% 6% 26%; mix-blend-mode:multiply; transition:transform .8s var(--ease); }
.st.is-photo img{ object-fit:cover; padding:0; mix-blend-mode:normal; }
.st:hover img{ transform:scale(1.05); }
.st__lbl{ position:absolute; inset-inline:12px; bottom:10px; display:flex; justify-content:space-between; align-items:flex-end; gap:8px; }
.st__lbl b{ display:block; font-size:14px; font-weight:600; line-height:1.3; }
.st__lbl small{ display:block; font-size:12px; color:var(--ink-2); }
.st.is-photo .st__lbl{ color:var(--white); }
.st.is-photo .st__lbl small{ color:rgba(255,255,255,.8); }
.st.is-photo::after{ content:""; position:absolute; inset:0; background:linear-gradient(transparent 55%, rgba(0,0,0,.45)); z-index:0; }
.st.is-photo .st__lbl{ z-index:1; }
.st__go{ width:30px; height:30px; flex:none; border-radius:50%; background:var(--black); color:var(--white); display:grid; place-items:center; transition:transform .5s var(--ease); }
.st:hover .st__go{ transform:rotate(calc(-45deg * var(--dir) * -1)); }
.st--a{ aspect-ratio:1 / .9; } .st--short{ aspect-ratio:1 / .68; } .st--tall{ aspect-ratio:1 / 1.45; } .st--sq{ aspect-ratio:1 / 1.12; } .st--full{ aspect-ratio:1 / 2.1; }
.st--short img{ padding:4% 6% 30%; }
.srow{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding-inline:2px; height:40px; }
.srow .stack span{ width:36px; height:36px; background:var(--white); border-color:var(--page); }
.srow__plus{ width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:var(--ink-2); }
.sstat{ position:relative; z-index:2; margin:-46px 10px 0; padding:14px 10px; border-radius:18px; background:rgba(255,255,255,.96); border:1px solid var(--g200); text-align:center; box-shadow:0 12px 30px rgba(0,0,0,.06); }
.sstat b{ display:block; font:600 clamp(22px, 2.2vw, 30px)/1.1 var(--f-latin); letter-spacing:-.03em; }
.sstat span{ display:block; margin-top:4px; font-size:12px; line-height:1.4; color:var(--ink-2); }
.shape__big{ position:relative; min-height:clamp(320px, 88vw, 420px); border-radius:26px; overflow:hidden; color:var(--white); display:flex; flex-direction:column; justify-content:space-between; padding:clamp(18px, 2.4vw, 32px); isolation:isolate; background:#8c8178; }
.shape__big > img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:-2; transform:scale(1.06); }
.shape__big::after{ content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.08) 55%, rgba(0,0,0,.3)); }
.shape__big h2{ font-size:clamp(36px, 4.6vw, 68px); font-weight:500; line-height:1; letter-spacing:-.04em; max-width:10ch; }
html[lang="ar"] .shape__big h2{ font-weight:600; line-height:1.3; letter-spacing:0; }
.shape__big p{ margin-top:12px; font-size:14px; max-width:30ch; color:rgba(255,255,255,.88); }
.shape__bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.sbtn{ width:44px; height:44px; border-radius:50%; border:1.5px solid rgba(255,255,255,.8); display:grid; place-items:center; color:var(--white); transition:transform .5s var(--ease), background-color .3s; }
.sbtn:hover{ background:rgba(255,255,255,.15); transform:rotate(calc(-45deg * var(--dir) * -1)); }
.sseg{ display:flex; gap:4px; padding:4px; border-radius:var(--r-pill); background:rgba(255,255,255,.22); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
.sseg a{ height:40px; padding-inline:16px; display:inline-flex; align-items:center; gap:8px; border-radius:var(--r-pill); color:var(--white); font-size:13px; font-weight:600; text-decoration:none; white-space:nowrap; transition:background-color .3s, color .3s; }
.sseg a.is-on, .sseg a:hover{ background:var(--white); color:var(--black); }
.sav{ width:44px; height:44px; border-radius:50%; background:var(--white); overflow:hidden; border:2px solid rgba(255,255,255,.8); }
.sav img{ width:100%; height:100%; object-fit:contain; padding:3px; }
@media (min-width:768px){ .shape__cols{ grid-auto-columns:minmax(0, 1fr); overflow:visible; margin-inline:0; padding-inline:0; } }
@media (min-width:1024px){
  .shape{ grid-template-columns:minmax(0, 1.55fr) minmax(0, 1fr); gap:16px; align-items:stretch; }
  .shape__cols{ gap:16px; }
  .sc{ gap:16px; }
  .sc > .st:last-child{ flex:1; aspect-ratio:auto; min-height:220px; }
  .shape__big{ min-height:0; }
}

/* ===================== 4. STATEMENT (words fill in on scroll) ===================== */
.stmt{ padding-block:var(--section) 0; }
.stmt p{ font-size:clamp(28px, 4.4vw, 64px); font-weight:500; line-height:1.15; letter-spacing:-.035em; max-width:22ch; margin-inline:auto; text-align:center; text-wrap:balance; }
html[lang="ar"] .stmt p{ font-weight:600; line-height:1.55; letter-spacing:0; max-width:24ch; }
.stmt .w{ opacity:.16; transition:opacity .2s; }
.motion .stmt .w{ transition:none; }
.no-motion .stmt .w{ opacity:1; }
.stmt .ipill{ width:2.1em; height:1em; }

/* ===================== 5. COLLECTIONS (dark list, image follows the pointer) ===================== */
.cols{ position:relative; background:var(--black); color:var(--white); border-radius:var(--r-card); padding:clamp(22px, 3vw, 40px); overflow:hidden; }
.cols__head{ display:grid; gap:12px; margin-bottom:var(--s6); }
@media (min-width:1024px){ .cols__head{ grid-template-columns:1fr 1.3fr; align-items:start; } .cols__head h2{ text-align:end; } html[dir="rtl"] .cols__head h2{ text-align:left; } }
.cols__head .eyebrow::before{ background:var(--white); }
.cols__head h2{ font-size:clamp(26px, 3vw, 40px); font-weight:500; line-height:1.15; letter-spacing:-.03em; }
html[lang="ar"] .cols__head h2{ font-weight:600; line-height:1.45; letter-spacing:0; }
.cols__list{ border-top:1px solid rgba(255,255,255,.18); }
.crow{ position:relative; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:16px; width:100%; padding:20px 14px; border-bottom:1px solid rgba(255,255,255,.18); text-align:start; color:inherit; border-radius:16px; transition:background-color .35s, color .35s, border-color .35s; }
.crow__idx{ font:500 13px/1 var(--f-latin); opacity:.6; width:2ch; }
.crow__name{ font-size:clamp(20px, 2.4vw, 30px); font-weight:500; letter-spacing:-.02em; line-height:1.2; }
.crow__meta{ display:block; font-size:13px; opacity:.65; margin-top:4px; letter-spacing:0; }
.crow__go{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; border:1px solid rgba(255,255,255,.3); transition:transform .5s var(--ease), background-color .3s, border-color .3s; }
.crow:hover, .crow.is-on{ background:var(--rose); color:var(--black); border-bottom-color:transparent; }
.crow:hover .crow__go, .crow.is-on .crow__go{ background:var(--white); border-color:var(--white); transform:rotate(calc(-45deg * var(--dir) * -1)); }
.crow__thumb{ display:none; }
@media (hover:none), (max-width:1023px){
  .crow{ grid-template-columns:auto 1fr auto; }

/* banner: a tilted white ring circles the table; its back half is drawn behind the table, its front half

const orbit = { intro: 0, scroll: 0, drift: 0 }, ANG = [150, 280, 30];
const bubbles = () => [[P.length, 'bDesigns'], [`${maxOff}%`, 'bOff'], [fmt(minPrice), 'bFrom']];
function ringGeo() {
  const st = $('#bStage'), w = st.offsetWidth, h = st.offsetHeight, b = $('.bn__b'), br = b ? b.offsetWidth / 2 : 50;
  // the ring (with its bubbles) must stay clear of the headline and the side panel
  const c = st.getBoundingClientRect(), cx = c.left + c.width / 2;
  const clear = innerWidth < 1024 ? w / 2 : Math.min(...[...$$('.bn__copy .line-mask > span'), $('.bn__side')].map(el => {
    const r = el.getBoundingClientRect(); return Math.min(Math.abs(r.left - cx), Math.abs(r.right - cx)); }));
  const rx = Math.max(120, Math.min(w * .46, h * .62, clear - br - 12));
  return { w, h, cx: w / 2, cy: h * .55, rx, ry: rx * .2, tilt: (lang === 'ar' ? 7 : -7) * Math.PI / 180 };
}
const ringPt = (g, a) => { const x = Math.cos(a) * g.rx, y = Math.sin(a) * g.ry;
  return [g.cx + x * Math.cos(g.tilt) - y * Math.sin(g.tilt), g.cy + x * Math.sin(g.tilt) + y * Math.cos(g.tilt)]; };
function drawRing() {
  const g = ringGeo(), sw = g.w < 500 ? 7 : 11;
  const arc = (a0, a1) => { let d = ''; for (let i = 0; i <= 64; i++) { const [x, y] = ringPt(g, a0 + (a1 - a0) * i / 64); d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); } return d; };
  [['#bRingB', Math.PI, Math.PI * 2, .9], ['#bRingF', 0, Math.PI, 1]].forEach(([id, a0, a1, o]) => {
    const svg = $(id); svg.setAttribute('viewBox', `0 0 ${g.w} ${g.h}`);
    svg.innerHTML = `<path d="${arc(a0, a1)}" fill="none" stroke="#fff" stroke-opacity="${o}" stroke-width="${sw}" stroke-linecap="round"/>`;
  });
}
function placeOrbit() {
  const g = ringGeo();
  $$('#bBubbles .bn__b').forEach((el, i) => {
    const a = (ANG[i] + orbit.intro + orbit.scroll + orbit.drift) * Math.PI / 180, [x, y] = ringPt(g, a), depth = Math.sin(a);
    el.style.transform = `translate(${x - el.offsetWidth / 2}px, ${y - el.offsetHeight / 2}px) scale(${.74 + .26 * (depth + 1) / 2})`;
    el.style.zIndex = depth > 0 ? 4 : 1;
  });
}
const rib = { off: 0, unit: 1, tp: null };
function drawRibbon() {
  const svg = $('#bRibbon'), W = $('#bannerCard').offsetWidth, mob = W < 768;
  const bw = mob ? 40 : Math.round(Math.min(78, W * .056)), H = mob ? 92 : Math.round(W * .105);
  const end = H + bw * 1.2, ctrl = 6 - H - bw * .2 + bw * .5;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.style.height = H + 'px';
  const word = `${t('ribbon')} ✦ `;
  svg.innerHTML = `<path id="ribP" d="M ${-W * .12} ${end} Q ${W / 2} ${ctrl} ${W * 1.12} ${end}" fill="none" stroke="#fff" stroke-width="${bw}"/>
    <text font-size="${Math.round(bw * .5)}" dominant-baseline="central"><textPath href="#ribP" id="ribT">${word.repeat(14)}</textPath></text>`;
  rib.tp = $('#ribT');
  rib.unit = rib.tp.getComputedTextLength() / 14 || 300;
}

  $('#colList').addEventListener('pointerleave', () => gsap.to(fl, { opacity: 0, scale: .6, duration: .3 }));
}

/* ---------------- scroll motion ---------------- */
function scrollMotion() {
  if (!G) return;
  // banner: the bubbles travel round the ring, the table lifts a little, the word sinks, the ribbon rises
  const bt = () => ({ trigger: '#bannerCard', start: 'top top', end: 'bottom top', scrub: true });
  gsap.to(orbit, { scroll: 90, ease: 'none', onUpdate: placeOrbit, scrollTrigger: bt() });
  gsap.to('#bTable img', { yPercent: -5, ease: 'none', scrollTrigger: bt() });
  gsap.to('#bWord', { yPercent: 30, ease: 'none', scrollTrigger: bt() });
  gsap.to('#bRibbon', { yPercent: -14, ease: 'none', scrollTrigger: bt() });
  $$('[data-reveal]').forEach(el => gsap.from(el, { y: 50, opacity: 0, duration: 1, ease: 'power3.out', scrollTrigger: { trigger: el, start: 'top 85%' } }));
  $$('[data-par]').forEach(el => gsap.fromTo(el, { yPercent: -5 }, { yPercent: 5, ease: 'none', scrollTrigger: { trigger: el.parentElement, start: 'top bottom', end: 'bottom top', scrub: true } }));
  gsap.from('#shapeCols .sc > *', { y: 60, opacity: 0, duration: .9, stagger: .06, ease: 'power3.out', scrollTrigger: { trigger: '#shapeCols', start: 'top 85%' } });
  gsap.from('.crow', { y: 30, opacity: 0, duration: .8, stagger: .07, ease: 'power3.out', scrollTrigger: { trigger: '#colList', start: 'top 85%' } });
  gsap.from('.cols', { clipPath: 'inset(8% 6% 8% 6% round 24px)', duration: 1.2, ease: 'power3.out', scrollTrigger: { trigger: '#cols', start: 'top 85%' } });
  // statement: words fill in one by one while scrolling through it
  stmtST = ScrollTrigger.create({ trigger: '#stmt', start: 'top 80%', end: 'bottom 45%', scrub: true,
    onUpdate: s => { const w = $$('#stmt .w'), n = s.progress * w.length * 1.05; w.forEach((el, i) => el.style.opacity = Math.max(.16, Math.min(1, n - i))); } });
}

/* ---------------- banner entrance (runs as the loader leaves) ---------------- */
function bannerIn() {
  if (!G) return;
  const tl = gsap.timeline();
  tl.from('#bannerCard', { scale: .94, borderRadius: 60, duration: 1.3, ease: 'expo.out' }, 0)
    .from('#bWord .ch', { yPercent: 110, duration: 1.2, stagger: .05, ease: 'expo.out' }, .1)
    .from('#bTable', { y: 60, opacity: 0, duration: 1.5, ease: 'expo.out' }, .3)
    .from('.bn__floor', { scaleX: .3, opacity: 0, duration: 1.4, ease: 'expo.out' }, .4)
    .from('.bn__ring', { opacity: 0, scale: .7, transformOrigin: '50% 55%', duration: 1.4, ease: 'expo.out' }, .45)
    .from(orbit, { intro: -120, duration: 2.2, ease: 'expo.out', onUpdate: placeOrbit }, .45)
    .from('#bBubbles .bn__bi', { scale: 0, duration: .7, stagger: .1, ease: 'back.out(2)' }, .7)
    .from('.bn__copy .line-mask > span', { yPercent: 110, duration: 1, stagger: .08, ease: 'expo.out' }, .55)
    .from('.bn__side > *, .bn__all, .bn__nav a', { opacity: 0, y: 14, duration: .8, stagger: .05 }, .8)
    .from('.bn__ribbon', { yPercent: 100, duration: 1.3, ease: 'expo.out' }, .6)
    .from('#logo .klogo__word', { y: 30, opacity: 0, duration: .9, ease: 'back.out(1.7)' }, .2);
  // the table floats gently
  gsap.to('#bTable img', { y: -10, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 1.8 });
}

/* ribbon text keeps running; scrolling speeds it up */
function ribbonRun() {
  if (!G) return;
  gsap.ticker.add(() => {
    if (!rib.tp) return;
    const v = lenis ? Math.min(Math.abs(lenis.velocity), 60) : 0;
    rib.off = (rib.off + (.6 + v * .25) * (lang === 'ar' ? 1 : -1) + rib.unit) % rib.unit;
    rib.tp.setAttribute('startOffset', rib.off - rib.unit);
    orbit.drift += .12; placeOrbit();
  });
}
addEventListener('resize', () => { drawRing(); placeOrbit(); drawRibbon(); });

/* ---------------- loader ---------------- */
function done() {
  root.classList.remove('is-loading');
  if (lenis) lenis.start();
  drawRing(); drawRibbon(); placeOrbit();   // re-measure now that the fonts are in
  scrollMotion(); bannerIn(); ribbonRun();
  ScrollTrigger && G && ScrollTrigger.refresh();
}
function runLoader() {
  const ldr = $('#loader');
  if (!G) { done(); return; }
  // ring of 8 tables in mixed shapes on pink and grey
  const pick = [['t03', 'circle', '#FCDFDB'], ['t12', 'arch', '#F4F4F4'], ['life1', 'sq', '#e9e7e4'], ['t01', 'pill', '#FCDFDB'], ['t08', 'circle', '#F4F4F4'], ['t17', 'sq', '#FCDFDB'], ['t15', 'arch', '#F4F4F4'], ['t02', 'circle', '#FCDFDB']];
  const ring = $('#ring');
  ring.innerHTML = pick.map(([id, sh, bg]) => `<span class="ring__t sh-${sh}${byId[id]?.photo ? ' is-photo' : ''}" style="--bg:${bg}"><img src="${img(id)}" alt=""></span>`).join('');
  const T = $$('.ring__t', ring);
  const geo = () => { const m = Math.min(innerWidth, innerHeight); return { R: Math.min(m * .36, 300), ts: Math.min(m * .2, 150) }; };
  let { R, ts } = geo(); ring.style.setProperty('--ts', ts + 'px');
  const a0 = T.map((_, i) => -Math.PI / 2 + i * Math.PI * 2 / T.length);
  const st = { spin: 0, r: R * .55 };
  const place = () => T.forEach((el, i) => { const a = a0[i] + st.spin; gsap.set(el, { x: Math.cos(a) * st.r, y: Math.sin(a) * st.r }); });
  gsap.ticker.add(place);

  let skipped = false;
  const tl = gsap.timeline({ onComplete: finish });
  tl.to('#ldDots', { opacity: 0, scale: .6, duration: .35, delay: .55 })
    .fromTo('#ldLine', { opacity: 0, y: 14, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: .6, ease: 'power3.out' })
    .to('#ldLine', { opacity: 0, y: -10, filter: 'blur(6px)', duration: .45, delay: .45 })
    .fromTo('#ldLogo', { opacity: 0, scale: .7 }, { opacity: 1, scale: 1, duration: .6, ease: 'back.out(1.8)' }, '-=.15')
    .addLabel('ring')
    .to(st, { r: R, duration: 1.2, ease: 'expo.out' }, 'ring')
    .fromTo(T, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: .55, stagger: .09, ease: 'back.out(1.8)' }, 'ring')
    .to(st, { spin: Math.PI * .9, duration: 2.4, ease: 'power2.inOut' }, 'ring')
    .addLabel('out', '-=.55')
    .to(st, { r: () => Math.hypot(innerWidth, innerHeight) * .75, duration: .9, ease: 'power3.in' }, 'out')
    .to(T, { scale: 1.6, opacity: 0, duration: .9, ease: 'power3.in', stagger: .02 }, 'out')
    .to('#ldLogo', { scale: .45, opacity: 0, y: () => -innerHeight * .35, duration: .7, ease: 'power3.in' }, 'out+=.1')
    .to(ldr, { opacity: 0, duration: .45 }, 'out+=.6')
    .add(() => { if (!skipped) bannerStart(); }, 'out+=.2');
  let started = false;
  function bannerStart() { if (started) return; started = true; done(); }
  function finish() { gsap.ticker.remove(place); ldr.remove(); bannerStart(); }
  const skip = () => { if (skipped) return; skipped = true; tl.kill(); gsap.to(ldr, { opacity: 0, duration: .3, onComplete: finish }); bannerStart(); };
  $('#ldSkip').onclick = skip;
  addEventListener('keydown', e => { if (e.key === 'Escape') skip(); }, { once: true });
  addEventListener('resize', () => ({ R, ts } = geo(), ring.style.setProperty('--ts', ts + 'px')));
  // wait until the ring images are decoded (max 1.2s) so the tiles never pop in empty
  tl.pause();
  const ready = Promise.all($$('img', ring).map(i => i.decode().catch(() => {})));
  Promise.race([ready, new Promise(r => setTimeout(r, 1200))]).then(() => tl.play());
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(runLoader); else runLoader();
})();
</script>
