/* ===================== TOKENS: light + dark ===================== */
:root{
  color-scheme:light;
  --bg:#F2F2F4; --surface:#fff; --surface-2:#F7F7F8; --text:#0B0B0B; --ink-2:#5B5B5B; --ink-3:#8A8A8A;
  --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.14); --well:#F4F4F4; --tile:#fff; --header-bg:rgba(255,255,255,.88);

  --mark:#E2E2E6; --bar:#088040; --lime:#C4F5A4;
  --f-latin:'Inter Tight', system-ui, sans-serif;
  --f-ar:'IBM Plex Sans Arabic', 'Inter Tight', system-ui, sans-serif;
  --font:var(--f-ar);
  --gutter:16px; --section:clamp(72px, 10vw, 140px);

  --ease:cubic-bezier(.16,1,.3,1);
  --header-h:60px; --dir:-1;
}
/* dark: the phone's setting, or the moon button */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D0E0D; --surface:#171817; --surface-2:#1F201F; --text:#F2F2EF; --ink-2:#ABABA6; --ink-3:#7C7C78;

  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D0E0D; --surface:#171817; --surface-2:#1F201F; --text:#F2F2EF; --ink-2:#ABABA6; --ink-3:#7C7C78;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16); --well:#EDECE8; --tile:#EDECE8; --header-bg:rgba(13,14,13,.84);

html[dir="ltr"]{ --dir:1; --font:var(--f-latin); }
@media (min-width:768px){ :root{ --gutter:32px; } }
@media (min-width:1200px){ :root{ --gutter:48px; --header-h:72px; } }

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; overflow-x:clip; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-size:16px; line-height:1.6; overflow-x:clip; -webkit-font-smoothing:antialiased; transition:background-color .4s, color .4s; }
img{ display:block; max-width:100%; height:auto; }
button, input{ font:inherit; color:inherit; background:none; border:0; padding:0; }
button{ cursor:pointer; }
a{ color:inherit; }
svg{ display:block; }
h1,h2,h3,p{ margin:0; }
ul{ margin:0; padding:0; list-style:none; }
.latin, .num{ font-family:var(--f-latin); }
.num{ font-variant-numeric:tabular-nums; }
.visually-hidden{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:focus-visible{ outline:2px solid var(--text); outline-offset:3px; border-radius:8px; }
.skip{ position:fixed; inset-inline-start:12px; top:-60px; z-index:300; background:var(--invert); color:var(--on-invert); padding:10px 16px; border-radius:var(--r-pill); text-decoration:none; transition:top .3s var(--ease); }
.skip:focus{ top:12px; }
.container{ width:100%; max-width:1440px; margin-inline:auto; padding-inline:var(--gutter); }
.section{ padding-top:var(--section); }
html[dir="rtl"] .flip svg{ transform:scaleX(-1); }

.eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
html[lang="en"] .eyebrow{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
.eyebrow::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--text); }
.h2{ font-size:clamp(32px, 4.4vw, 60px); font-weight:600; line-height:1.05; letter-spacing:-.035em; }
html[lang="ar"] .h2{ font-weight:700; line-height:1.3; letter-spacing:0; }
.sub{ color:var(--ink-2); font-size:clamp(15px, 1.2vw, 17px); max-width:46ch; }
.head{ display:grid; gap:14px; margin-bottom:clamp(28px, 4vw, 52px); }
.icon-btn{ display:inline-grid; place-items:center; width:44px; height:44px; border-radius:var(--r-pill); transition:background-color .25s; }
.icon-btn:hover{ background:var(--line); }
.btn{ position:relative; display:inline-flex; align-items:center; justify-content:center; gap:10px; height:52px; padding-inline:22px; border-radius:var(--r-pill); font-weight:600; font-size:15px; white-space:nowrap; text-decoration:none; transition:transform .4s var(--ease), background-color .3s; }
.btn:active{ transform:scale(.97); }
.btn-ink{ background:var(--invert); color:var(--on-invert); }

/* ===================== INTRO: Hello 👋 → typed welcome → dots → the search bar ===================== */
.intro{ position:fixed; inset:0; z-index:200; background:var(--bg); display:grid; place-items:center; overflow:hidden; }
html:not(.is-intro) .intro, .no-motion .intro{ display:none; }
html.is-intro body{ overflow:hidden; }
.intro__wrap{ display:grid; justify-items:center; gap:clamp(14px, 2vw, 24px); text-align:center; padding-inline:24px; }
.intro__hello{ display:flex; align-items:flex-start; gap:.08em; font:700 clamp(84px, 16vw, 200px)/.9 var(--f-latin); letter-spacing:-.06em; direction:ltr; }
.intro__hello .ch{ display:inline-block; }
.wave{ display:inline-block; font-size:.62em; line-height:1; margin-top:-.12em; transform-origin:70% 80%; }
.wave.is-on{ animation:wave 1.6s ease-in-out infinite; }
@keyframes wave{ 0%,60%,100%{ transform:rotate(0); } 10%{ transform:rotate(16deg); } 20%{ transform:rotate(-10deg); } 30%{ transform:rotate(16deg); } 40%{ transform:rotate(-6deg); } 50%{ transform:rotate(10deg); } }
.intro__line{ min-height:1.6em; font-size:clamp(20px, 2.6vw, 32px); font-weight:600; }
.intro__line .caret{ display:inline-block; width:2px; height:1em; margin-inline-start:3px; vertical-align:-.12em; background:var(--text); animation:caret .8s steps(1) infinite; }
@keyframes caret{ 50%{ opacity:0; } }
.intro__dots{ position:absolute; left:50%; top:50%; display:flex; gap:10px; transform:translate(-50%, -50%); opacity:0; }
.intro__dots i{ width:16px; height:16px; border-radius:50%; background:var(--text); }
.intro__dots i:nth-child(2){ background:var(--ink-3); }
.intro__dots.is-on i{ animation:dot 1s var(--ease) infinite; }
.intro__dots.is-on i:nth-child(2){ animation-delay:.12s; } .intro__dots.is-on i:nth-child(3){ animation-delay:.24s; }
@keyframes dot{ 0%,100%{ transform:translateY(0); opacity:.45; } 40%{ transform:translateY(-10px); opacity:1; } }
.intro__pill{ position:fixed; left:50%; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:999px; background:var(--surface); box-shadow:0 0 0 1px var(--line-2), 0 18px 50px rgba(0,0,0,.14); opacity:0; }
.intro__skip{ position:absolute; bottom:calc(20px + env(safe-area-inset-bottom)); inset-inline-end:20px; font-size:13px; font-weight:600; padding:8px 16px; border-radius:var(--r-pill); border:1px solid var(--line-2); opacity:.75; }
.intro__skip:hover{ opacity:1; }

/* ===================== ANNOUNCEMENT + HEADER ===================== */
.announce{ position:relative; z-index:61; background:var(--bar); color:#fff; height:36px; overflow:hidden; display:flex; align-items:center; font-size:13px; font-weight:500; }
.marquee{ display:flex; width:max-content; animation:marquee 32s linear infinite; }
.marquee__group{ display:flex; align-items:center; gap:28px; padding-inline-end:28px; white-space:nowrap; }
.marquee__group span{ display:inline-flex; align-items:center; gap:28px; }
.marquee__group span::after{ content:""; width:5px; height:5px; border-radius:50%; background:#fff; }
@keyframes marquee{ to{ transform:translateX(calc(50% * var(--dir) * -1)); } }
.header{ position:sticky; top:0; z-index:60; background:var(--header-bg); -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid transparent; transition:border-color .35s, background-color .4s; }
.header.is-scrolled{ border-bottom-color:var(--line); }
.header__inner{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; height:var(--header-h); }
.header__start, .header__end{ display:flex; align-items:center; gap:2px; }
.header__end{ justify-content:flex-end; }
.logo{ display:block; color:var(--text); text-decoration:none; }
.logo svg{ width:64px; height:auto; overflow:visible; }
.klogo .kl{ transform-box:fill-box; transform-origin:50% 100%; transition:transform .6s var(--ease), opacity .35s var(--ease); }
.klogo__smile{ transform-box:fill-box; transform-origin:50% 50%; opacity:0; clip-path:inset(0 50% 0 50%); transform:translateY(-10%) scale(.7); transition:clip-path .55s var(--ease), opacity .25s, transform .6s var(--ease); }
.header.is-scrolled .klogo .kl{ transform:translateY(10%) scale(.2, .04); opacity:0; }
.header.is-scrolled .klogo .klogo__smile{ opacity:1; clip-path:inset(0 0 0 0); transform:translateY(-34%) scale(1.18); transition-delay:.18s; }
.nav{ display:none; gap:4px; margin-inline-start:6px; }
.nav a{ height:36px; padding-inline:12px; display:inline-flex; align-items:center; border-radius:var(--r-pill); font-size:14px; font-weight:500; text-decoration:none; transition:background-color .25s; }
.nav a:hover{ background:var(--line); }
@media (min-width:1100px){ .nav{ display:flex; } }
.lang-btn{ height:36px; padding-inline:14px; border-radius:var(--r-pill); border:1px solid var(--text); font-size:13px; font-weight:600; margin-inline-start:6px; transition:background-color .25s, color .25s; }
.lang-btn:hover{ background:var(--invert); color:var(--on-invert); }
.cart-btn{ position:relative; }
.cart-count{ position:absolute; top:4px; inset-inline-end:2px; min-width:18px; height:18px; padding-inline:5px; border-radius:var(--r-pill); background:var(--invert); color:var(--on-invert); font:600 11px/18px var(--f-latin); text-align:center; transform:scale(0); transition:transform .4s var(--ease); }
.cart-count.has-items{ transform:scale(1); }
.cart-count.bump{ animation:bump .5s var(--ease); }
@keyframes bump{ 40%{ transform:scale(1.45); } }
@media (max-width:767px){ .hide-mob{ display:none!important; } }

/* ===================== 1. HERO: greeting + the smart search + a strip of products ===================== */
.hero{ position:relative; min-height:calc(100svh - 36px - var(--header-h)); display:grid; grid-template-rows:1fr; justify-items:center; align-items:center; padding-block:clamp(18px, 3.5vh, 48px) clamp(10px, 2vh, 22px); }
.hero__in{ position:relative; z-index:5; width:min(100%, 820px); display:grid; justify-items:center; text-align:center; gap:clamp(14px, 2vw, 22px); }
.greet{ display:inline-flex; align-items:center; gap:10px; height:44px; padding-inline:8px 18px; border-radius:var(--r-pill); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); font-weight:600; font-size:15px; }
.greet .wave{ font-size:20px; display:grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--surface-2); }
.greet__txt{ display:inline-block; min-width:12ch; }
.hero__h{ font-size:clamp(36px, 5.4vw, 78px); font-weight:600; line-height:1.02; letter-spacing:-.045em; }
html[lang="ar"] .hero__h{ font-weight:700; line-height:1.25; letter-spacing:0; }
.hero__tx{ color:var(--ink-2); font-size:clamp(15px, 1.3vw, 18px); max-width:44ch; }
.hero__chips{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
.hero__chips .chip{ height:40px; padding-inline:16px; background:var(--surface); }

/* small photos floating either side of the search (wide screens), lined up on its edges; .fl__in bobs */
.floaters{ position:absolute; inset:0; z-index:1; pointer-events:none; --cw:min(820px, 100%); }
.fl{ position:absolute; top:var(--y); width:var(--w); pointer-events:auto; }
.fl--s{ inset-inline-start:calc(50% - var(--cw) / 2 - var(--x) - var(--w)); }
.fl--e{ inset-inline-end:calc(50% - var(--cw) / 2 - var(--x) - var(--w)); }
.fl__in{ display:block; aspect-ratio:var(--ar, 1); border-radius:clamp(14px, 1.3vw, 20px); overflow:hidden; background:var(--well); box-shadow:0 18px 40px rgba(0,0,0,.08); animation:float var(--d, 7s) ease-in-out var(--dl, 0s) infinite alternate; transition:box-shadow .4s; }
.fl__in img{ width:100%; height:100%; object-fit:cover; transition:transform .7s var(--ease); }
.fl--p .fl__in{ background:#fff; }
.fl--p img{ object-fit:contain; padding:9%; mix-blend-mode:multiply; }
.fl:hover .fl__in{ animation-play-state:paused; box-shadow:0 24px 54px rgba(0,0,0,.14); }
.fl:hover img{ transform:scale(1.06); }
@keyframes float{ from{ transform:translateY(-9px) rotate(var(--r, 0deg)); } to{ transform:translateY(9px) rotate(calc(var(--r, 0deg) * -1)); } }
@media (max-width:1199px){ .floaters{ display:none; } }

/* the search: a frosted grey pill, a magnifier, typed hints, and a round button with turning dots */
.sbox{ position:relative; z-index:20; width:100%; margin-top:6px; isolation:isolate; }
.sbox__input::-webkit-search-cancel-button, .sbox__input::-webkit-search-decoration{ -webkit-appearance:none; appearance:none; }
.sbox__field{ position:relative; display:flex; align-items:center; gap:12px; height:clamp(60px, 6.2vw, 84px); padding-inline:clamp(18px, 2vw, 26px) 9px; border-radius:var(--r-pill); color:#fff; background:linear-gradient(135deg, rgba(92,92,98,.86), rgba(58,58,64,.9)); -webkit-backdrop-filter:blur(22px) saturate(1.6); backdrop-filter:blur(22px) saturate(1.6); box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 1px rgba(255,255,255,.26), 0 24px 60px rgba(0,0,0,.16); transition:background-color .4s, box-shadow .4s; }
.sbox.is-focus .sbox__field{ background:linear-gradient(135deg, rgba(80,80,86,.92), rgba(46,46,52,.94)); box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 1px rgba(255,255,255,.4), 0 0 0 5px rgba(255,255,255,.22), 0 24px 60px rgba(0,0,0,.2); }
.sbox.is-idle .sbox__field{ animation:glow 2.2s ease-in-out infinite; }
@keyframes glow{ 50%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 0 0 1px rgba(255,255,255,.55), 0 0 0 7px rgba(255,255,255,.28), 0 24px 60px rgba(0,0,0,.16); } }
.sbox__lead{ flex:none; display:grid; place-items:center; }
.sbox__lead svg{ width:clamp(22px, 2vw, 28px); height:auto; }
.sbox__input{ flex:1; min-width:0; height:100%; color:#fff; caret-color:#fff; font-size:clamp(17px, 1.8vw, 25px); font-weight:500; outline:0; text-shadow:0 1px 10px rgba(0,0,0,.18); }
.sbox__input::placeholder{ color:transparent; }
.sbox__ph{ position:absolute; inset-inline-start:calc(clamp(18px, 2vw, 26px) + clamp(22px, 2vw, 28px) + 12px); inset-inline-end:clamp(76px, 7.6vw, 98px); top:50%; transform:translateY(-50%); color:rgba(255,255,255,.95); font-size:clamp(17px, 1.8vw, 25px); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; text-align:start; text-shadow:0 1px 10px rgba(0,0,0,.18); }
.sbox__ph .caret{ display:inline-block; width:2px; height:1.05em; margin-inline-start:2px; vertical-align:-.15em; background:#fff; animation:caret .8s steps(1) infinite; }
.sbox.has-text .sbox__ph{ opacity:0; }
.sbox__clear{ width:36px; height:36px; border-radius:50%; display:none; place-items:center; color:#fff; flex:none; }
.sbox.has-text .sbox__clear{ display:grid; }
.sbox__clear:hover{ background:rgba(255,255,255,.18); }
.sbox__go{ flex:none; height:calc(100% - 18px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:#fff; color:#0B0B0B; box-shadow:0 6px 18px rgba(0,0,0,.14); transition:transform .4s var(--ease); }
.sbox__go:hover{ transform:scale(1.06); }
.sbox__go svg{ width:48%; height:auto; animation:spin 9s linear infinite; }
.sbox.is-focus .sbox__go svg, .sbox.is-idle .sbox__go svg{ animation-duration:2.4s; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.sbox__tip{ position:absolute; bottom:calc(100% + 14px); inset-inline-end:clamp(20px, 8%, 90px); padding:9px 14px; border-radius:16px; background:var(--invert); color:var(--on-invert); font-size:14px; font-weight:600; white-space:nowrap; opacity:0; transform:translateY(8px) scale(.9); transition:opacity .4s, transform .5s var(--ease); pointer-events:none; }
.sbox__tip::after{ content:""; position:absolute; top:100%; inset-inline-end:26px; border:7px solid transparent; border-top-color:var(--invert); }
.sbox.is-idle .sbox__tip{ opacity:1; transform:none; animation:tipBob 2.4s ease-in-out infinite; }
@keyframes tipBob{ 50%{ transform:translateY(-4px); } }
@media (max-width:639px){ .sbox__tip{ display:none; } }

/* suggestions */
.sres{ position:absolute; z-index:30; top:calc(100% + 10px); inset-inline:0; max-height:min(52vh, 460px); overflow:auto; overscroll-behavior:contain; border-radius:26px; background:var(--surface); box-shadow:var(--shadow), inset 0 0 0 1px var(--line); padding:10px; text-align:start; opacity:0; visibility:hidden; transform:translateY(-6px); transition:opacity .25s, transform .35s var(--ease), visibility 0s .35s; }
.sbox.is-open .sres{ opacity:1; visibility:visible; transform:none; transition:opacity .25s, transform .35s var(--ease); }
.sres h4{ margin:8px 10px 6px; font-size:12px; font-weight:600; color:var(--ink-3); }
html[lang="en"] .sres h4{ text-transform:uppercase; letter-spacing:.08em; }
.sres__chips{ display:flex; flex-wrap:wrap; gap:6px; padding:2px 8px 8px; }
.chip{ display:inline-flex; align-items:center; gap:6px; height:36px; padding-inline:14px; border-radius:var(--r-pill); background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line); font-size:14px; font-weight:500; white-space:nowrap; transition:background-color .25s, color .25s, transform .3s var(--ease); }
.chip:hover, .chip.is-act{ background:var(--invert); color:var(--on-invert); box-shadow:none; }
.chip svg{ opacity:.6; }
.srow{ display:grid; grid-template-columns:56px 1fr auto; align-items:center; gap:12px; width:100%; padding:8px; border-radius:16px; text-align:start; transition:background-color .2s; }
.srow:hover, .srow.is-act{ background:var(--surface-2); }
.srow__img{ width:56px; height:56px; border-radius:14px; background:var(--well); overflow:hidden; }
.srow__img img{ width:100%; height:100%; object-fit:contain; mix-blend-mode:multiply; padding:6px; }
.srow b{ display:block; font-weight:600; font-size:15px; line-height:1.35; }
.srow b mark{ background:var(--mark); color:inherit; border-radius:4px; padding-inline:1px; }
.srow small{ display:block; color:var(--ink-3); font-size:12.5px; }
.srow__p{ text-align:end; font:600 15px/1.2 var(--f-latin); white-space:nowrap; }
.srow__p s{ display:block; font-weight:400; font-size:12px; color:var(--ink-3); }
.srow__p em{ font-style:normal; font-size:11px; color:var(--ink-2); margin-inline-start:3px; }
.sres__none{ padding:22px 14px; text-align:center; color:var(--ink-2); }
.sres__all{ display:flex; justify-content:center; width:100%; padding:12px; margin-top:4px; border-radius:16px; font-weight:600; font-size:14px; background:var(--surface-2); }
.sres__all:hover{ background:var(--invert); color:var(--on-invert); }

/* ===================== 2. ABOUT: one statement at a time, each with its own piece (sticky while you scroll) ===================== */
.story{ position:relative; height:320vh; }
.story__pin{ position:sticky; top:var(--header-h); height:calc(100svh - var(--header-h)); overflow:clip; display:grid; align-content:center; align-items:center; gap:clamp(22px, 5vw, 90px); }
@media (min-width:900px){ .story__pin{ grid-template-columns:1.3fr 1fr; } }
.story__copy{ display:grid; gap:clamp(18px, 2.4vw, 30px); }
.story__meta{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
.story__count{ font-size:14px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.story__count b{ color:var(--text); }
.story__slides{ display:grid; }
.ss{ grid-area:1 / 1; font-size:clamp(34px, 5vw, 80px); font-weight:600; line-height:1.08; letter-spacing:-.045em; }
html[lang="ar"] .ss{ font-weight:700; line-height:1.4; letter-spacing:0; }
.wm{ display:inline-block; overflow:hidden; vertical-align:top; padding-block:.14em; margin-block:-.14em; }
.wi{ display:inline-block; will-change:transform; }
.hl-m{ color:#fff; background:linear-gradient(var(--bar), var(--bar)) no-repeat; background-size:var(--hs, 100%) 76%; background-position:0 60%; border-radius:.16em; padding-inline:.1em; margin-inline:-.04em; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
html[dir="rtl"] .hl-m{ background-position:100% 60%; }
.hl-p{ color:var(--bar); }
.story__bars{ display:flex; gap:8px; }
.story__bars i{ position:relative; flex:1; max-width:90px; height:4px; border-radius:4px; background:var(--line-2); overflow:hidden; }
.story__bars i::after{ content:""; position:absolute; inset:0; border-radius:inherit; background:var(--text); transform:scaleX(var(--p, 0)); transform-origin:left; }
html[dir="rtl"] .story__bars i::after{ transform-origin:right; }
.story__art{ position:relative; width:min(100%, 500px, calc(100svh - var(--header-h) - 120px)); aspect-ratio:1; justify-self:center; }
.sa{ position:absolute; inset:0; display:grid; place-items:center; }
/* the piece on its own, no background: a cut-out with a soft shadow on the floor */
.sa__t{ position:relative; width:84%; height:84%; background:#fff; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.08), inset 0 0 0 1px rgba(0,0,0,.04); }
.sa__t img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:13%; }
.sa__t.sh-c{ border-radius:50%; } .sa__t.sh-a{ width:66%; border-radius:999px 999px 36px 36px; } .sa__t.sh-p{ width:58%; border-radius:999px; }
.sa__chip{ position:absolute; bottom:4%; inset-inline-start:2%; z-index:2; display:flex; align-items:center; gap:10px; padding:8px 16px 8px 8px; border-radius:var(--r-pill); background:var(--surface); box-shadow:var(--shadow), inset 0 0 0 1px var(--line); font-size:14px; font-weight:600; white-space:nowrap; }
html[dir="rtl"] .sa__chip{ padding:8px 8px 8px 16px; }
.sa__chip i{ width:34px; height:34px; border-radius:50%; background:var(--invert); color:var(--on-invert); display:grid; place-items:center; }
.sa__chip small{ display:block; font:600 12px/1.2 var(--f-latin); color:var(--ink-2); }
@media (max-width:899px){
  .story{ height:300vh; }
  .story__art{ order:-1; width:min(64vw, 290px, calc(100svh - var(--header-h) - 330px)); }
  .story__copy{ text-align:center; } .story__meta{ justify-content:center; gap:14px; } .story__bars{ justify-content:center; }
  .ss{ font-size:clamp(28px, 8vw, 44px); }
  .sa__chip{ font-size:12.5px; bottom:0; }
}
.no-motion .story{ height:auto; padding-block:var(--section); }
.no-motion .story__pin{ position:static; height:auto; }
.no-motion .story__slides{ gap:20px; } .no-motion .ss{ grid-area:auto; }
.no-motion .sa:not(:first-child), .no-motion .story__bars, .no-motion .story__count{ display:none; }

/* ===================== 3. DEPARTMENTS: a bento of photo tiles that pop in one by one ===================== */
/* photo tiles for the departments, plus filler boxes: the green ket card, a white logo box, a grey pill and a green deals bar */
/* heading + bento together fill one screen, on phones too (same three columns) */
.dept{ display:flex; flex-direction:column; gap:clamp(10px, 1.6vh, 18px); height:calc(100svh - var(--header-h)); max-height:960px; margin-top:var(--section); padding-block:clamp(10px, 2vh, 22px); scroll-margin-top:var(--header-h); }
.dept .head{ display:none; }   /* the green ket line across the top is the title now */
.dept .h2{ font-size:clamp(24px, 3vw, 44px); }
.bento{ flex:1; min-height:0; display:grid; gap:clamp(6px, .7vw, 10px); grid-template-columns:1fr 1fr 1fr; grid-template-rows:auto repeat(8, 1fr);
  grid-template-areas:"brand brand brand" "rugs trees logo" "rugs trees logo" "rugs trees logo" "feat tables lamps" "feat tables lamps" "feat home lamps" "pill home lamps" "cta home lamps"; }
.dc{ position:relative; display:block; border-radius:clamp(16px, 2.2vw, 30px); overflow:hidden; background:#2B2B2B; color:#fff; text-decoration:none; isolation:isolate; box-shadow:0 18px 44px rgba(0,0,0,.1); }
/* each photo fills its tile; --op frames it on laptops, --opm on phones */
.dc__img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:var(--op); transition:transform 1.4s var(--ease); }
.dc__blur img{ object-position:var(--op); }
.dc:hover .dc__img{ transform:scale(1.05); }
.motion .bento:not(.is-in) .dc, .motion .bento:not(.is-in) .lady{ opacity:0; }   /* until they pop in (bentoIn) */
/* the frosted bottom: a blurred copy of the same photo, faded in from below */
.dc__blur{ position:absolute; inset:0; overflow:hidden; -webkit-mask-image:linear-gradient(to top, #000 16%, rgba(0,0,0,.75) 28%, transparent 48%); mask-image:linear-gradient(to top, #000 16%, rgba(0,0,0,.75) 28%, transparent 48%); }
.dc__blur img{ width:100%; height:100%; object-fit:cover; filter:blur(24px) saturate(1.25); transform:scale(1.2); }
.dc__blur::after{ content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.32), rgba(0,0,0,.1) 40%, transparent 62%); }
.dc__n{ position:absolute; z-index:2; top:14px; inset-inline-end:14px; height:28px; padding-inline:11px; border-radius:var(--r-pill); background:rgba(255,255,255,.2); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); font-size:12px; font-weight:600; line-height:28px; }
.dc__body{ position:absolute; z-index:2; inset-inline:clamp(14px, 1.8vw, 26px); bottom:clamp(14px, 1.8vw, 26px); display:grid; justify-items:start; gap:6px; }
.dc__body h3{ font-size:clamp(22px, 2.4vw, 36px); font-weight:600; line-height:1.1; letter-spacing:-.03em; text-shadow:0 2px 20px rgba(0,0,0,.16); }
html[lang="ar"] .dc__body h3{ font-weight:700; line-height:1.35; letter-spacing:0; }
.dc--lamps .dc__body h3{ font-size:clamp(28px, 3.2vw, 48px); }
.dc__body p{ max-width:34ch; font-size:clamp(13px, 1.05vw, 15px); opacity:.9; }
.dc--tables .dc__body p, .dc--rugs .dc__body p{ display:none; }   /* the short tiles: title and button only */
/* lamps: the hand holding the lamp is at the bottom of the photo, so the words go on top */
.dc--lamps .dc__body{ bottom:auto; top:clamp(14px, 1.8vw, 26px); }
.dc--lamps .dc__n{ top:auto; bottom:14px; }
.dc--lamps .dc__blur{ -webkit-mask-image:linear-gradient(to bottom, #000 16%, rgba(0,0,0,.75) 30%, transparent 50%); mask-image:linear-gradient(to bottom, #000 16%, rgba(0,0,0,.75) 30%, transparent 50%); }
.dc--lamps .dc__blur::after{ background:linear-gradient(to bottom, rgba(0,0,0,.3), rgba(0,0,0,.1) 40%, transparent 60%); }
.dc__go{ display:inline-flex; align-items:center; gap:8px; height:clamp(42px, 3.6vw, 50px); margin-top:6px; padding-inline:18px 6px; border-radius:var(--r-pill); background:#fff; color:#0B0B0B; font-size:14px; font-weight:600; white-space:nowrap; transition:transform .4s var(--ease); }
html[dir="rtl"] .dc__go{ padding-inline:18px 6px; }
.dc__go i{ width:clamp(32px, 2.8vw, 38px); height:clamp(32px, 2.8vw, 38px); border-radius:50%; display:grid; place-items:center; background:#0B0B0B; color:#fff; transition:transform .5s var(--ease); }
.dc:hover .dc__go i{ transform:rotate(calc(-45deg * var(--dir) * -1)); }
.dc:active .dc__go{ transform:scale(.97); }
/* the brand tile: ket, the count, the line */
.dc--brand{ display:flex; flex-direction:row; align-items:flex-end; justify-content:space-between; gap:14px; padding:clamp(18px, 2vw, 30px); background:var(--bar); overflow:hidden; }
.dc--brand .dc__pills{ order:2; flex-direction:column; align-items:flex-start; flex:none; }
.dc--brand .mark{ position:absolute; z-index:-1; top:-95%; inset-inline-end:14%; width:30%; color:#066B36; transform:rotate(calc(-18deg * var(--dir))); }
.dc--brand .mark svg{ width:100%; height:auto; }
.dc__pills{ display:flex; flex-wrap:wrap; gap:8px; }
.dc__pills span{ display:inline-flex; align-items:center; gap:6px; height:30px; padding-inline:8px 12px; border-radius:var(--r-pill); background:rgba(255,255,255,.92); color:#0B0B0B; font-size:12.5px; font-weight:600; }
.dc__pills span:nth-child(2){ background:#fff; }
.dc__pills i{ width:18px; height:18px; border-radius:50%; display:grid; place-items:center; background:#0B0B0B; color:#fff; font-size:10px; font-style:normal; }
.dc--brand h3{ font-size:clamp(26px, 2.8vw, 42px); font-weight:600; line-height:1.1; letter-spacing:-.03em; }
html[lang="ar"] .dc--brand h3{ font-weight:700; line-height:1.4; letter-spacing:0; }
.dc--brand h3 em{ font-style:normal; opacity:.72; }
.dc--logo{ display:grid; place-items:center; background:#C9EADB; }   /* the shopping lady on mint (her white background blends in) */
/* the lady sits on her own layer over the mint tile, so on phones her legs can run out over the next photo
   (her white background disappears there too: multiply). She faces the way the page reads */
.lady{ grid-area:logo; position:relative; z-index:6; align-self:center; justify-self:center; height:96%; width:auto; max-width:none; pointer-events:none; filter:drop-shadow(0 10px 14px rgba(0,0,0,.12)); }
html[dir="rtl"] .lady{ scale:-1 1; }
.dc--pill{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-inline:clamp(16px, 1.8vw, 26px); border-radius:var(--r-pill); background:#D4C6FB; color:#0B0B0B; box-shadow:none; font-weight:600; font-size:clamp(13px, 1.1vw, 15px); }
.dc--pill b{ font:700 clamp(18px, 1.8vw, 26px)/1 var(--f-latin); margin-inline-end:6px; }
.dc--cta{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-inline:clamp(16px, 1.8vw, 26px); background:var(--bar); font-weight:700; font-size:clamp(14px, 1.2vw, 17px); }
.dc--cta small{ display:block; font:600 12.5px/1.3 var(--f-latin); opacity:.8; font-variant-numeric:tabular-nums; }
.dc--cta i{ width:38px; height:38px; flex:none; border-radius:50%; display:grid; place-items:center; background:#fff; color:#0B0B0B; transition:transform .5s var(--ease); }
.dc--cta:hover i{ transform:rotate(calc(-45deg * var(--dir) * -1)); }
/* discounts: light green, three cut-out pieces fanned at the bottom, opens the discounts page */
.dc--feat{ display:block; background:var(--lime); color:#0B3D22; }
.dc--feat .dc__top{ position:absolute; z-index:2; inset-inline:clamp(12px, 1.6vw, 24px); top:clamp(12px, 1.6vw, 22px); display:grid; justify-items:start; gap:6px; }
.dc--feat h3{ font-size:clamp(22px, 2.4vw, 36px); font-weight:700; line-height:1.1; letter-spacing:-.02em; }
.dc--feat .dc__off{ height:26px; padding-inline:10px; border-radius:var(--r-pill); background:var(--bar); color:#fff; font:700 12.5px/26px var(--f-latin); }
.dc--feat .dc__fan{ position:absolute; inset-inline:4%; bottom:4%; height:62%; }
.dc--feat .dc__fan img{ position:absolute; bottom:0; height:100%; width:auto; max-width:none; filter:drop-shadow(0 10px 12px rgba(11,61,34,.2)); transition:transform .6s var(--ease); }
.dc--feat .dc__fan img:nth-child(1){ height:72%; inset-inline-start:0; rotate:-8deg; }
.dc--feat .dc__fan img:nth-child(2){ height:100%; inset-inline-start:50%; translate:calc(-50% * var(--dir)) 0; z-index:1; }
.dc--feat .dc__fan img:nth-child(3){ height:78%; inset-inline-end:0; rotate:8deg; }
.dc--feat:hover .dc__fan img:nth-child(1){ transform:translate(calc(-6px * var(--dir)), -4px) rotate(-4deg); }
.dc--feat:hover .dc__fan img:nth-child(3){ transform:translate(calc(6px * var(--dir)), -4px) rotate(4deg); }
.dc--feat .dc__go{ position:absolute; z-index:3; inset-inline-end:clamp(10px, 1.4vw, 20px); bottom:clamp(10px, 1.4vw, 20px); margin:0; padding:0; background:none; }
.dc--feat .dc__go i{ background:#0B3D22; color:#fff; }
/* phones: the ket line runs across the top, then three columns like the laptop's */
@media (max-width:767px){
  .dept{ height:calc(100svh - var(--header-h)); padding-block:10px 12px; gap:0; }
  .dept .head{ display:none; }
  .bento{ gap:6px; grid-template-rows:auto repeat(8, 1fr);
    grid-template-areas:"brand brand brand" "trees rugs logo" "trees rugs logo" "trees rugs logo" "tables rugs home" "tables feat home" "lamps feat home" "lamps pill home" "lamps cta home"; }
  .dc{ border-radius:16px; }
  .dc__img, .dc__blur img{ object-position:var(--opm, var(--op)); }
  .dc__body{ inset-inline:8px; bottom:8px; gap:4px; }
  .dc--lamps .dc__body{ top:8px; }
  .dc__body p, .dc__n{ display:none; }
  .dc__body h3, .dc--lamps .dc__body h3{ font-size:13.5px; line-height:1.3; }
  .dc__go{ height:28px; margin-top:2px; padding:0; gap:0; background:none; }
  html[dir="rtl"] .dc__go{ padding:0; }
  .dc__go{ font-size:0; }
  .dc__go i{ width:28px; height:28px; background:#fff; color:#0B0B0B; }
  .lady{ height:auto; width:168%; justify-self:end; margin-inline-end:-6%; align-self:center; }   /* her legs run out over the photo beside her */
  .dc--brand{ flex-direction:row; align-items:stretch; justify-content:space-between; min-height:138px; padding:16px 16px 14px; gap:10px; }
  .dc--brand h3{ align-self:flex-start; }
  .dc--brand .mark{ top:-48%; width:58%; inset-inline-end:-14%; }
  .dc--brand .dc__pills{ order:2; flex-direction:column; flex:none; align-self:flex-end; }
  .dc__pills{ gap:4px; }
  .dc__pills span{ height:22px; padding-inline:4px 8px; font-size:10px; gap:4px; }
  .dc__pills span:nth-child(2){ margin-inline-start:0; }
  .dc--feat h3{ font-size:16px; }
  .dc--feat .dc__off{ height:20px; padding-inline:7px; font-size:10.5px; line-height:20px; }
  .dc--feat .dc__fan{ height:56%; bottom:6%; }
  .dc--feat .dc__go{ inset-inline-end:6px; bottom:6px; }
  .dc__pills i{ width:14px; height:14px; font-size:8px; }
  .dc--brand h3{ font-size:19px; line-height:1.4; }
  .dc--logo svg{ width:58%; }
  .dc--pill{ padding-inline:10px; font-size:0; }
  .dc--pill b{ font-size:15px; margin:0; }
  .dc--pill span::after{ content:attr(data-short); font-size:11px; font-weight:600; margin-inline-start:4px; }
  .dc--pill svg{ width:14px; }
  .dc--cta{ padding-inline:10px; font-size:11.5px; gap:4px; }
  .dc--cta small{ font-size:10.5px; }
  .dc--cta i{ display:none; }
}

/* ===================== 4. 24-HOUR CLEARANCE: a light studio; swipe the pieces and the card below changes with them ===================== */
.clr{ /* the studio stays light in dark mode too */
  color-scheme:light; --text:#0B0B0B; --ink-2:#5B5B5B; --ink-3:#8A8A8A; --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.14); --surface:#fff; --surface-2:#F7F7F8; --invert:#0B0B0B; --on-invert:#fff;
  position:relative; border-radius:clamp(28px, 4vw, 48px); background:#E9E9EC; color:var(--text); padding:clamp(22px, 4vw, 56px) 0 clamp(22px, 3vw, 40px); overflow:hidden; }
.clr__head{ display:grid; gap:18px; padding-inline:clamp(18px, 4vw, 56px); margin-bottom:clamp(14px, 3vw, 36px); }
@media (min-width:1024px){ .clr__head{ grid-template-columns:1fr auto; align-items:end; } }
.clr__ey{ display:inline-flex; align-items:center; gap:8px; justify-self:start; height:32px; padding-inline:10px 14px; border-radius:var(--r-pill); background:#0B0B0B; color:#fff; font-size:13px; font-weight:700; }
.clr__ey .fire{ animation:fire 1.2s ease-in-out infinite alternate; display:inline-block; }
@keyframes fire{ to{ transform:scale(1.2) rotate(-6deg); } }
.clock-w{ display:grid; gap:10px; justify-items:start; }
@media (min-width:1024px){ .clock-w{ justify-items:center; } }
.clock__lbl{ font-size:13px; font-weight:600; color:var(--ink-2); }
.clock{ display:flex; align-items:center; gap:8px; direction:ltr; }
.clock__u{ display:grid; justify-items:center; gap:4px; }
.clock__u b{ display:grid; place-items:center; min-width:clamp(62px, 6vw, 84px); height:clamp(62px, 6vw, 84px); padding-inline:8px; border-radius:20px; background:var(--lime); color:#0B3D22; font:700 clamp(30px, 3vw, 44px)/1 var(--f-latin); font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
.clock__u:last-child b{ background:var(--lime); color:#0B3D22; }
.clock__u small{ font-size:12px; color:var(--ink-2); }
.clock__sep{ font:700 30px/1 var(--f-latin); color:var(--ink-3); margin-bottom:22px; animation:caret 1s steps(1) infinite; }

.sb{ --pc:clamp(250px, 27vw, 380px); position:relative; display:grid; justify-items:center; }
.sb__stage{ position:relative; width:100%; height:var(--pc); touch-action:pan-y; cursor:grab; -webkit-user-select:none; user-select:none; }
.sb__stage.is-drag{ cursor:grabbing; }
/* each piece is a cut-out (media/cut), so it stays solid over the grey and the white card */
.sbi{ position:absolute; left:50%; top:0; width:var(--pc); height:var(--pc); margin-left:calc(var(--pc) / -2); transform-origin:50% 70%; will-change:transform, filter; }
.sbi img{ position:relative; z-index:1; width:100%; height:100%; object-fit:contain; padding:4%; pointer-events:none; }
.sbi__sh{ position:absolute; left:18%; right:18%; bottom:4%; height:8%; border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.34), rgba(0,0,0,.12) 60%, transparent); filter:blur(4px); z-index:2; mix-blend-mode:multiply; }
/* the card sits under the front piece, which overlaps its top edge */
.sb__card{ position:relative; z-index:45; width:min(calc(100% - 32px), 460px); margin-top:calc(var(--pc) * -.34); padding:calc(var(--pc) * .26) 22px 18px; border-radius:32px; background:#fff; box-shadow:0 60px 80px -44px rgba(0,0,0,.4), 0 28px 60px -24px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.04); text-align:start; }
.sb__txt{ position:relative; min-height:156px; }
.sbt{ display:grid; gap:9px; }
.sbt.is-out{ position:absolute; inset:0 0 auto; pointer-events:none; }
.sbt__row{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.sbt__price{ color:var(--bar); font:800 clamp(36px, 3.4vw, 46px)/1 var(--f-latin); letter-spacing:-.04em; }
.sbt__price small{ font-size:.36em; font-weight:600; margin-inline-start:4px; letter-spacing:0; }
.sbt__row s{ font:500 17px/1 var(--f-latin); color:var(--ink-3); }
.sbt__off{ margin-inline-start:auto; align-self:center; height:30px; padding-inline:12px; border-radius:var(--r-pill); background:var(--bar); color:#fff; font:700 14px/30px var(--f-latin); }
.sbt__name{ font-size:18px; font-weight:600; line-height:1.35; }
.sbt__meta{ font-size:13px; font-weight:500; color:var(--ink-2); }
.sbt__meta .num{ unicode-bidi:isolate; color:var(--text); font-weight:600; }
.stock{ display:grid; gap:6px; }
.stock span{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; }
.stock span::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--lime); animation:ping 1.4s infinite; }
@keyframes ping{ 0%{ box-shadow:0 0 0 0 rgba(150,220,110,.7); } 100%{ box-shadow:0 0 0 8px rgba(150,220,110,0); } }
.stock i{ display:block; height:7px; border-radius:7px; background:#EDEDEF; overflow:hidden; }
.stock i::after{ content:""; display:block; height:100%; width:var(--w); border-radius:inherit; background:var(--lime); }
.sb__buy{ background:var(--bar); color:#fff; width:100%; height:54px; margin-top:16px; }
.car__nav{ display:flex; justify-content:center; align-items:center; gap:14px; margin-top:22px; }
.car__btn{ width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); transition:background-color .25s, color .25s, transform .4s var(--ease); }
.car__btn:hover{ background:var(--invert); color:var(--on-invert); }
.car__btn:active{ transform:scale(.92); }
.car__dots{ display:flex; gap:6px; }
.car__dots button{ width:8px; height:8px; border-radius:8px; background:var(--line-2); transition:width .4s var(--ease), background-color .3s; }
.car__dots button.is-on{ width:26px; background:var(--text); }

/* ===================== 5. CUSTOMER VIDEOS: a fanned stack of cards; tap the front one for hearts ===================== */
.exp__head{ display:grid; gap:18px; margin-bottom:clamp(20px, 3vw, 36px); }
@media (min-width:1024px){ .exp__head{ grid-template-columns:1fr auto; align-items:end; } }
.socials{ display:flex; flex-wrap:wrap; gap:10px; }
/* white buttons, the logo inside */
.soc{ display:inline-flex; align-items:center; gap:10px; height:54px; padding-inline:7px 18px; border-radius:var(--r-pill); background:#fff; color:#0B0B0B; box-shadow:0 8px 24px rgba(0,0,0,.06), inset 0 0 0 1px rgba(0,0,0,.06); text-decoration:none; font-weight:600; font-size:14px; transition:transform .4s var(--ease), box-shadow .4s; }
.soc:hover{ transform:translateY(-3px); box-shadow:0 14px 30px rgba(0,0,0,.1), inset 0 0 0 1px rgba(0,0,0,.06); }
.soc i{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:#fff; color:#0B0B0B; box-shadow:inset 0 0 0 1px rgba(0,0,0,.1); }
.fan{ --fw:clamp(210px, 21vw, 280px); position:relative; height:calc(var(--fw) * 16 / 11); touch-action:pan-y; cursor:grab; -webkit-user-select:none; user-select:none; }
.fan.is-drag{ cursor:grabbing; }
.fc{ position:absolute; left:50%; top:0; width:var(--fw); margin-left:calc(var(--fw) / -2); aspect-ratio:11 / 16; border-radius:26px; overflow:hidden; background:#2B2B2B; box-shadow:0 22px 50px rgba(0,0,0,.18); transform-origin:50% 50%; will-change:transform; }
.fc::before{ content:""; position:absolute; inset:0; z-index:2; background:#000; opacity:var(--dim, 0); pointer-events:none; }
.fc img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; }
.fc__tag{ position:absolute; z-index:3; top:12px; inset-inline-start:12px; height:26px; padding-inline:10px; border-radius:var(--r-pill); background:rgba(255,255,255,.22); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:#fff; font-size:12px; font-weight:600; line-height:26px; transition:opacity .3s; }
.fc__play{ position:absolute; z-index:3; bottom:12px; inset-inline-end:12px; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; background:#fff; color:#0B0B0B; box-shadow:0 6px 16px rgba(0,0,0,.18); transition:transform .4s var(--ease), opacity .3s; }
.fc__play:hover{ transform:scale(1.08); }
.fc:not(.is-front) .fc__tag, .fc:not(.is-front) .fc__play{ opacity:0; pointer-events:none; }
.fan__cap{ position:relative; display:grid; justify-items:center; gap:2px; min-height:52px; margin-top:20px; text-align:center; }
.fan__cap b{ font-size:15px; font-weight:600; }
.fan__cap span{ font-size:13px; color:var(--ink-2); }
.heart{ position:fixed; z-index:320; left:0; top:0; pointer-events:none; font-size:30px; line-height:1; will-change:transform, opacity; filter:drop-shadow(0 4px 10px rgba(0,0,0,.2)); }
.heart svg{ width:32px; height:32px; }
.vbox{ border:0; padding:0; background:transparent; max-width:none; max-height:none; overflow:visible; }
.vbox::backdrop{ background:rgba(0,0,0,.72); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.vbox__in{ position:relative; width:min(92vw, 400px); aspect-ratio:9 / 16; max-height:86svh; border-radius:28px; overflow:hidden; background:#111; color:#fff; }
.vbox__in img, .vbox__in video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.vbox__in img{ animation:kb 10s ease-in-out infinite alternate; }
@keyframes kb{ from{ transform:scale(1.02); } to{ transform:scale(1.14) translate(2%, -2%); } }
.vbox__note{ position:absolute; z-index:2; inset-inline:14px; bottom:14px; padding:12px 14px; border-radius:16px; background:rgba(0,0,0,.55); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); font-size:13px; text-align:center; }
.vbox__bar{ position:absolute; z-index:2; top:12px; inset-inline:14px; height:3px; border-radius:3px; background:rgba(255,255,255,.3); overflow:hidden; }
.vbox__bar::after{ content:""; display:block; height:100%; width:100%; background:#fff; transform-origin:left; animation:bar 8s linear infinite; }
html[dir="rtl"] .vbox__bar::after{ transform-origin:right; }
@keyframes bar{ from{ transform:scaleX(0); } }
.vbox__x{ position:absolute; z-index:3; top:24px; inset-inline-end:14px; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.2); color:#fff; }

/* ===================== 6. VISITORS: live numbers and someone shopping from her chair ===================== */
.vis{ /* white in both themes: the drawing is on white */
  color-scheme:light; --text:#0B0B0B; --ink-2:#5B5B5B;
  position:relative; border-radius:clamp(28px, 4vw, 48px); background:#fff; color:var(--text); overflow:hidden; padding:clamp(32px, 4.4vw, 64px) 16px clamp(8px, 2vw, 24px); text-align:center; }
.vis__head{ display:grid; gap:12px; justify-items:center; }
.stats{ display:grid; grid-template-columns:repeat(3, 1fr); gap:clamp(8px, 2vw, 24px); max-width:860px; margin:clamp(22px, 3vw, 36px) auto 0; }
.stat b{ display:block; font:700 clamp(30px, 4.6vw, 62px)/1 var(--f-latin); letter-spacing:-.045em; font-variant-numeric:tabular-nums; }
.stat span{ display:inline-flex; align-items:center; gap:7px; margin-top:10px; font-size:clamp(12.5px, 1.1vw, 15px); color:var(--ink-2); }
.stat--now span::after{ content:""; width:9px; height:9px; border-radius:50%; background:#22C55E; animation:ping2 1.6s infinite; }
@keyframes ping2{ 0%{ box-shadow:0 0 0 0 rgba(34,197,94,.5); } 100%{ box-shadow:0 0 0 9px rgba(34,197,94,0); } }
.vis__art{ width:min(100%, 640px); aspect-ratio:566 / 464; margin:clamp(14px, 3vw, 36px) auto 0; }
.vis__art img{ width:100%; height:100%; object-fit:contain; }

/* ===================== FOOTER (as the tables page) ===================== */
.footer{ background:var(--bar); color:#fff; padding-block:48px; margin-top:var(--section); }
.footer__grid{ display:grid; gap:24px; justify-items:center; text-align:center; }
.footer__mark{ display:grid; justify-items:center; gap:10px; }
.footer__mark svg{ width:64px; height:auto; }
.footer__copy{ font-size:13px; color:rgba(255,255,255,.75); }
@media (max-width:1023px){ .footer__touch{ order:1; } .pays{ order:2; } .footer__legal{ order:3; } .footer__mark{ order:4; margin-top:12px; } }
.footer__touch{ display:grid; justify-items:center; gap:12px; }
.footer__touch p{ font-size:15px; font-weight:500; }
.social{ display:flex; gap:4px; }
.social a{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:#fff; }
.social a:hover{ background:rgba(255,255,255,.14); }
.pays{ direction:ltr; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:16px 26px; }
.pay{ display:inline-flex; align-items:center; color:#fff; font:700 19px/1 var(--f-latin); letter-spacing:-.02em; }
.pay--visa{ font-style:italic; font-weight:800; font-size:21px; }
.pay--mada{ font-size:15px; flex-direction:column; gap:1px; align-items:flex-start; }
.pay--mada i{ display:block; width:32px; height:4px; background:#fff; border-radius:1px; }
.pay--amex{ font-size:9.5px; font-weight:800; background:#fff; color:#0B0B0B; padding:6px 5px; border-radius:3px; }
.footer__legal{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px 18px; font-size:12px; }
.footer__legal .sbc{ padding:6px 10px; border:1px solid rgba(255,255,255,.45); border-radius:8px; font-size:11px; }
.footer__legal .ids{ display:grid; gap:2px; text-align:start; }
@media (min-width:1024px){
  .footer__grid{ grid-template-columns:1fr 1fr; justify-items:stretch; text-align:start; row-gap:32px; }
  .footer__mark{ grid-column:1; grid-row:1; justify-items:start; }
  .footer__touch{ grid-column:2; grid-row:1; justify-items:end; }
  .pays, .footer__legal{ grid-column:1 / -1; justify-self:center; }
}
.wa{ position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); inset-inline-start:16px; z-index:54; width:54px; height:54px; border-radius:50%; background:var(--invert); color:var(--on-invert); display:grid; place-items:center; box-shadow:0 8px 24px rgba(0,0,0,.18); text-decoration:none; }
.toast{ position:fixed; z-index:310; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); background:var(--invert); color:var(--on-invert); padding:12px 18px; border-radius:var(--r-pill); font-size:14px; max-width:calc(100vw - 32px); width:max-content; text-align:center; opacity:0; visibility:hidden; transition:all .45s var(--ease); }
.toast.is-on{ opacity:1; visibility:visible; transform:translate(-50%, 0); }

@media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
</style>

<body>
<a class="skip" href="#q" data-t="skip"></a>

<!-- INTRO: "Hello! 👋", a typed welcome, three dots, and the dots become the search bar (once per visit) -->

</div>

<div class="announce" role="region" aria-label="Announcements"><div class="marquee" id="marquee"></div></div>

<header class="header" id="header">
  <div class="container header__inner">
    <div class="header__start">
      <button class="icon-btn" id="searchBtn" data-t-aria="search"></button>

<main id="main">

  <section class="hero container" aria-labelledby="heroH">

  <!-- 2. ABOUT -->

        <div class="story__meta"><span class="eyebrow" data-t="stEy"></span><span class="story__count latin"><b id="stN">01</b> / 03</span></div>
        <div class="story__slides" id="storySlides"></div>
        <div class="story__bars" id="stBars"><i></i><i></i><i></i></div>
      </div>
      <div class="story__art" id="storyArt"></div>
    </div>
  </section>

  <!-- 3. DEPARTMENTS -->
  <section class="container dept" id="cats" aria-labelledby="catH">
    <div class="head"><span class="eyebrow" data-t="catEy"></span><h2 class="h2" id="catH" data-t="catH"></h2></div>
    <div class="bento" id="catGrid"></div>
  </section>

  <!-- 4. 24-HOUR CLEARANCE -->
  <section class="section container" id="deals" aria-labelledby="clrH">
    <div class="clr">
      <div class="clr__head">
        <div class="head" style="margin:0">
          <span class="clr__ey"><span class="fire" aria-hidden="true">🔥</span><span data-t="clrEy"></span></span>
          <h2 class="h2" id="clrH" data-t="clrH"></h2>
          <p class="sub" data-t="clrTx"></p>
        </div>
        <div class="clock-w"><span class="clock__lbl" data-t="nextDrop"></span><div class="clock" id="clock" role="timer" aria-live="off"></div></div>
      </div>
      <div class="sb" id="sb">
        <div class="sb__stage" id="sbStage" tabindex="0" aria-roledescription="carousel"></div>

          <div class="sb__txt" id="sbTxt" aria-live="polite"></div>
          <button class="btn btn-ink sb__buy" id="sbBuy" type="button"></button>

      <div class="car__nav">
        <button class="car__btn flip" id="carPrev" type="button" data-t-aria="prev"></button>
        <div class="car__dots" id="carDots"></div>
        <button class="car__btn flip" id="carNext" type="button" data-t-aria="next"></button>

  <!-- 5. CUSTOMER VIDEOS -->

  <!-- 6. VISITORS -->

<footer class="footer">
  <div class="container footer__grid">
    <div class="footer__mark"><span id="footerSmile"></span><p class="footer__copy">© <span data-t="allRights"></span></p></div>
    <div class="footer__touch"><p data-t="touch"></p><div class="social" id="social"></div></div>
    <div class="pays" aria-label="Payment methods">
      <span class="pay pay--visa">VISA</span><span class="pay">Pay</span><span class="pay">tabby</span><span class="pay pay--mada"><i></i>mada</span><span class="pay">Flow</span><span class="pay pay--amex">AMERICAN<br>EXPRESS</span>
    </div>

<a class="wa" id="wa" href="#" data-toast="soon" data-t-aria="wa"></a>

<dialog class="vbox" id="vbox">
  <div class="vbox__in" id="vboxIn"></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
(() => {
'use strict';
const $ = (s, c = document) => c.querySelector(s);
const $$ = (s, c = document) => [...c.querySelectorAll(s)];
const root = document.documentElement;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const G = !!(window.gsap && window.ScrollTrigger) && !reduce;
root.classList.add(G ? 'motion' : 'no-motion');
const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
if (G) gsap.registerPlugin(ScrollTrigger);
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

let lang = 'ar';
const t = (k, v) => { let s = STORE.ui[lang][k] ?? k; if (v && typeof s === 'string') for (const x in v) s = s.replace(`{${x}}`, v[x]); return s; };
const L = o => (o && typeof o === 'object' && 'ar' in o) ? o[lang] : o;
const fmt = n => n.toLocaleString('en-US');
const cur = () => STORE.currency[lang];
const img = p => `media/${p}.webp`;
const P = STORE.products, byId = Object.fromEntries(P.map(p => [p.id, p]));
const catOf = id => STORE.cats.find(c => c.id === id);
const off = (was, price) => Math.round((1 - price / was) * 100);
const maxOff = () => Math.max(...STORE.products.filter(p => p.was).map(p => off(p.was, p.price)));
ICON.arrow = '<path d="M5 12h14M13 6l6 6-6 6"/>';
ICON.moon = '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>';
ICON.sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>';
ICON.play = '<path d="M8 5.5v13l11-6.5-11-6.5Z" fill="currentColor"/>';
ICON.cartplus = '<path d="M2.5 4h2l2.2 11h11.8l2-8H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>';

/* ---------------- static chrome ---------------- */
$('#searchBtn').innerHTML = icon('search');
$('#accountBtn').innerHTML = icon('user');
$('#cartBtn').insertAdjacentHTML('afterbegin', icon('bag'));
$('#logo').innerHTML = logo(64);
$('#footerSmile').innerHTML = smileMark(64);
$('#wa').innerHTML = icon('wa', 28);
$('#sClear').innerHTML = icon('close', 18, 1.8);
$('#sLead').innerHTML = icon('search', 26, 1.8);
// "previous" points back: the arrow is mirrored on a wrapper so the RTL flip on the svg still applies
$('#carPrev').innerHTML = `<span style="display:block;transform:scaleX(-1)">${icon('arrow', 20, 1.8)}</span>`;
$('#carNext').innerHTML = icon('arrow', 20, 1.8);
$('#fanPrev').innerHTML = $('#carPrev').innerHTML; $('#fanNext').innerHTML = $('#carNext').innerHTML;
$('#icoIg').innerHTML = icon('ig', 20, 1.8);
$('#icoTt').innerHTML = icon('tiktok', 20, 1.8);
$('#lnkIg').href = STORE.links.instagram; $('#lnkTt').href = STORE.links.tiktok;
$('#social').innerHTML = [['snap', 'Snapchat'], ['ig', 'Instagram'], ['tiktok', 'TikTok'], ['wa', 'WhatsApp'], ['mail', 'Email'], ['globe', 'Website']].map(([i, n]) => `<a href="#" data-toast="soon" aria-label="${n}">${icon(i, 20)}</a>`).join('');
const grp = () => `<div class="marquee__group">${[1, 2, 3, 1, 2, 3].map(i => `<span data-t="ann${i}"></span>`).join('')}</div>`;
$('#marquee').innerHTML = grp() + grp().replace('class="marquee__group"', 'class="marquee__group" aria-hidden="true"');

/* ---------------- theme (light / dark) ---------------- */
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const paintTheme = () => { const d = isDark(); $('#themeBtn').innerHTML = icon(d ? 'sun' : 'moon', 21, 1.6); $('#themeBtn').setAttribute('aria-pressed', d); };
$('#themeBtn').onclick = () => { root.dataset.theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('ketTheme', root.dataset.theme); } catch (e) {} paintTheme(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme);
paintTheme();

/* ---------------- cart + toast ---------------- */
let cart = 0, tt;
const toast = m => { const el = $('#toast'); el.textContent = m; el.classList.add('is-on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('is-on'), 2400); };
const addToCart = () => { cart++; const c = $('#cartCount'); c.textContent = cart; c.classList.add('has-items'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); toast(t('added')); };
document.addEventListener('click', e => { const a = e.target.closest('[data-toast]'); if (a) { e.preventDefault(); toast(t(a.dataset.toast)); } });
const openProduct = p => { if (p.url) location.href = p.url; else if (p.cat === 'tables') location.href = 'ket-tables.html'; else toast(t('prodSoon')); };
const openCat = c => { if (c.url) location.href = c.url; else toast(t('soon')); };

/* ======================================================================
   SEARCH: real matches from the store's products and departments, by name
   (Arabic spelling variants are folded together) or by product number.
   ====================================================================== */
const norm = s => String(s).toLowerCase()
  .replace(/[ً-ٰٟـ]/g, '')            // tashkeel + tatweel
  .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/ڤ/g, 'ف').replace(/گ/g, 'ك')
  .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
  .replace(/[‎‏‏‎|_\-–]/g, ' ').replace(/\s+/g, ' ').trim();
const IDX = P.map(p => ({ p, ar: norm(p.ar), en: norm(p.en), sku: p.sku ? norm(p.sku).replace(/\s/g, '') : '', cat: catOf(p.cat) }));
STORE.cats.forEach(c => { c.n = P.filter(p => p.cat === c.id).length; c.kwN = [...c.kw.map(norm), norm(c.ar), norm(c.en)]; });

function search(qRaw) {
  const q = norm(qRaw); if (!q) return { cats: [], prods: [], num: false };
  const words = q.split(' ').filter(w => w.length > 0);
  const qc = q.replace(/\s/g, '');
  const num = /\d/.test(q) && /^[a-z]*\s?\d/.test(q);
  // departments whose name or keywords match any word
  const cats = STORE.cats.filter(c => words.some(w => c.kwN.some(k => k.startsWith(w) || (w.length > 2 && k.includes(w)) || (w.length > 3 && w.includes(k)))));
  const scored = [];
  for (const it of IDX) {
    let s = 0;
    if (it.sku && (it.sku.includes(qc) || qc.includes(it.sku))) s += 100;
    for (const w of words) {
      const hay = it.ar + ' ' + it.en;
      if (it.ar.startsWith(w) || it.en.startsWith(w)) s += 12;
      else if (hay.split(' ').some(x => x.startsWith(w))) s += 9;
      else if (w.length > 1 && hay.includes(w)) s += 5;
    }
    if (cats.includes(it.cat)) s += 4;
    if (s) scored.push([s, it.p]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  return { cats, prods: scored.map(x => x[1]), num };
}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function mark(name, qRaw) {
  const words = norm(qRaw).split(' ').filter(w => w.length > 0); if (!words.length) return esc(name);
  // highlight on the normalised string, mapped back to the original characters
  const map = []; let n = '';
  [...name].forEach((ch, i) => { const c = norm(ch) || (ch === ' ' ? ' ' : ''); for (const x of c) { n += x; map.push(i); } });
  const hits = new Array(name.length).fill(false);
  words.forEach(w => { let k = n.indexOf(w); while (k > -1 && w) { for (let j = k; j < k + w.length; j++) hits[map[j]] = true; k = n.indexOf(w, k + w.length); } });
  let out = '', on = false;
  [...name].forEach((ch, i) => { if (hits[i] && !on) { out += '<mark>'; on = true; } if (!hits[i] && on) { out += '</mark>'; on = false; } out += esc(ch); });
  return out + (on ? '</mark>' : '');
}
const priceHTML = p => p.price ? `<span class="srow__p">${fmt(p.price)}<em>${cur()}</em>${p.was ? `<s>${fmt(p.was)}</s>` : ''}</span>` : '<span></span>';
const rowHTML = (p, qRaw, i) => `<button class="srow" type="button" role="option" data-pid="${p.id}" data-i="${i}">
  <span class="srow__img"><img src="${img(p.img)}" alt="" loading="lazy"></span>
  <span><b>${mark(L(p), qRaw)}</b><small>${L(catOf(p.cat))}${p.sku ? ` · <span class="latin">${p.sku}</span>` : ''}</small></span>${priceHTML(p)}</button>`;

const sbox = $('#sbox'), q = $('#q'), sres = $('#sres');
let act = -1;
function renderRes() {
  const v = q.value; sbox.classList.toggle('has-text', !!v);
  let h = '';
  if (!v.trim()) {
    h = `<h4>${t('sTrend')}</h4><div class="sres__chips">${t('trend').map(x => `<button class="chip" type="button" data-q="${x}">${icon('search', 14, 2)}${x}</button>`).join('')}</div>
      <h4>${t('sPick')}</h4>${['tc', 't03', 'lp03', 'tr06'].map((id, i) => rowHTML(byId[id], '', i)).join('')}`;

/* ======================================================================
   5. CUSTOMER VIDEOS: a fanned stack; swipe through, tap the front card for
   hearts, the play button opens the video
   ====================================================================== */
let fanShown = -1;
function renderVideos() {
  $('#fan').innerHTML = STORE.videos.map((v, i) => `<div class="fc" data-i="${i}"><img src="${img(v.poster)}" alt="" draggable="false"><span class="fc__tag">${t('expTag')}</span><button class="fc__play" type="button" data-play="${i}" aria-label="${t('expPlay')}">${icon('play', 18, 0)}</button></div>`).join('');
  $('#fanDots').innerHTML = STORE.videos.map((_, i) => `<button type="button" aria-label="${i + 1}"></button>`).join('');
  fanShown = -1; layoutFan();
}
const fanStep = () => ($('.fc')?.offsetWidth || 260) * .6;
function layoutFan() {
  const cs = $$('.fc'), n = cs.length; if (!n) return;
  const W = cs[0].offsetWidth, dirX = lang === 'ar' ? -1 : 1;
  cs.forEach((el, i) => {
    const d = wrapD(i - fan.pos, n), a = Math.min(Math.abs(d), 3.4), sg = Math.sign(d);
    const x = (a <= 1 ? a * .6 : .6 + (a - 1) * .22) * W * sg * dirX;
    el.style.transform = `translate3d(${x.toFixed(1)}px,0,0) perspective(1000px) rotateY(${(sg * dirX * Math.min(a, 1) * 24).toFixed(2)}deg) scale(${(1 - a * .13).toFixed(3)})`;
    el.style.zIndex = 50 - Math.round(a * 10);
    el.style.setProperty('--dim', (Math.min(a, 2) * .14).toFixed(3));
    el.style.opacity = Math.abs(d) > 3.3 ? 0 : 1;
    el.classList.toggle('is-front', Math.abs(d) < .5);
  });
  const on = ((Math.round(fan.pos) % n) + n) % n;
  $$('#fanDots button').forEach((b, i) => b.classList.toggle('is-on', i === on));
  if (on !== fanShown) {
    fanShown = on; const p = byId[STORE.videos[on].product], cap = $('#fanCap');
    cap.innerHTML = `<b>${L(p)}</b><span>${fmt(p.price)} ${cur()} · ${t('expTag')}</span>`;
    if (G) gsap.fromTo(cap, { opacity: 0, y: 8, filter: 'blur(4px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: .45, ease: 'power3.out', clearProps: 'transform,filter,opacity' });
  }
}
// hearts float up from where the card was tapped
const HEART = '<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 4.2 2.6.6-1.5 2.1-2.6 4.2-2.6 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21Z"/></svg>';
function hearts(x, y) {
  if (!G) return;
  for (let k = 0; k < 9; k++) {
    const h = document.createElement('span'); h.className = 'heart'; h.innerHTML = k % 2 ? HEART : '🤍'; document.body.appendChild(h);
    const big = k === 0, del = k * .045;
    gsap.set(h, { x: x - 16, y: y - 16, scale: 0, rotate: (Math.random() - .5) * 40 });
    gsap.to(h, big ? { scale: 2.2, y: y - 60, duration: .7, ease: 'back.out(2.4)' }
      : { x: x - 16 + (Math.random() - .5) * 150, y: y - 140 - Math.random() * 170, scale: .7 + Math.random() * .7, rotate: (Math.random() - .5) * 60, duration: 1.2 + Math.random() * .6, delay: del, ease: 'power2.out' });
    gsap.to(h, { opacity: 0, duration: .45, delay: (big ? .45 : .75) + del + Math.random() * .3, onComplete: () => h.remove() });
  }
}
function openVideo(i) {
  const v = STORE.videos[i];
  $('#vboxIn').innerHTML = `${v.video ? `<video src="${v.video}" poster="${img(v.poster)}" autoplay playsinline controls></video>` : `<img src="${img(v.poster)}" alt=""><span class="vbox__bar"></span><p class="vbox__note">${t('expNote')}</p>`}<button class="vbox__x" type="button" aria-label="${t('close')}">${icon('close', 20, 1.8)}</button>`;
  $('#vbox').showModal(); if (lenis) lenis.stop();
}
let fanHold = 0, fanSeen = false;
const fan = looper({ el: $('#fan'), step: fanStep, render: layoutFan, hold: () => { fanHold = Date.now(); },
  tap: e => {
    fanHold = Date.now();
    const pl = e.target.closest('[data-play]'); if (pl) { openVideo(+pl.dataset.play); return; }
    const c = e.target.closest('.fc'); if (!c) return;
    const d = wrapD(+c.dataset.i - fan.pos, STORE.videos.length);
    if (Math.abs(d) > .5) fan.go(fan.pos + d); else hearts(e.clientX, e.clientY);
  } });
$('#fanPrev').onclick = () => { fanHold = Date.now(); fan.go(Math.round(fan.pos) - 1); };
$('#fanNext').onclick = () => { fanHold = Date.now(); fan.go(Math.round(fan.pos) + 1); };
$('#fanDots').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; fanHold = Date.now(); fan.go(fan.pos + wrapD($$('#fanDots button').indexOf(b) - fan.pos, STORE.videos.length)); });
new IntersectionObserver(([en]) => { fanSeen = en.isIntersecting; }, { threshold: .5 }).observe($('#fan'));
if (!reduce) setInterval(() => { if (fanSeen && Date.now() - fanHold > 6000 && !$('#vbox').open) fan.go(Math.round(fan.pos) + 1, 1); }, 3600);
$('#vbox').addEventListener('click', e => { if (e.target.id === 'vbox' || e.target.closest('.vbox__x')) $('#vbox').close(); });
$('#vbox').addEventListener('close', () => { $('#vboxIn').innerHTML = ''; if (lenis) lenis.start(); });
addEventListener('resize', () => { layoutDeals(); layoutFan(); });

/* ======================================================================
   6. VISITORS + someone shopping from her chair.
   The prototype has no analytics, so the numbers are simulated (they grow with the
   day of the month / week and drift gently). In the live store they come from the
   store's analytics through a small server endpoint.
   ====================================================================== */
const vis = (() => { const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  const now = Math.round(60 + 70 * Math.sin(Math.PI * Math.max(0, h - 8) / 16) + Math.random() * 25);
  const week = Math.round(((d.getDay() + 1) % 7 || 7) * 1480 + h * 58 + Math.random() * 90);
  const month = Math.round((d.getDate() - 1) * 1530 + week * .35 + h * 60 + 2400);
  return { month, week, now }; })();
const visShown = { month: 0, week: 0, now: 0 };
const paintVis = () => { $('#vMonth').textContent = fmt(Math.round(visShown.month)); $('#vWeek').textContent = fmt(Math.round(visShown.week)); $('#vNow').textContent = fmt(Math.round(visShown.now)); };
setInterval(() => { vis.now = Math.max(30, Math.min(260, vis.now + Math.round((Math.random() - .45) * 7))); if (Math.random() < .6) { vis.week += 1; vis.month += 1; } if (visShown.now) { Object.assign(visShown, vis); paintVis(); } }, 3000);

/* ---------------- language ---------------- */
function applyLang() {
  root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = lang === 'ar' ? 'ket · أثاث وديكور' : 'ket · Furniture & décor';
  $$('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $$('[data-t-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.tAria)));
  $('#langBtn').textContent = lang === 'ar' ? 'EN' : 'ع';
  $('#langBtn').setAttribute('aria-label', lang === 'ar' ? 'Switch to English' : 'التبديل إلى العربية');
  $('#vatNo').textContent = t('vatNo', { n: STORE.vat }); $('#crNo').textContent = t('crNo', { n: STORE.cr });
  $('#greetTxt').textContent = greetList()[gI % greetList().length];
  $('#heroChips').innerHTML = STORE.cats.map(c => `<button class="chip" type="button" data-cat-chip="${c.id}">${L(c)}</button>`).join('');
  renderStory(); renderFloaters(); renderCats(); renderDeals(); renderVideos(); renderClock();
  if (sbox.classList.contains('is-open')) renderRes();
  phI = 0; typeHints();
  if (G) { storyMotion(); requestAnimationFrame(() => ScrollTrigger.refresh()); }
}
$('#langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; applyLang(); };
document.addEventListener('click', e => { const a = e.target.closest('[data-focus-search]'); if (a) { e.preventDefault(); $('#searchBtn').click(); } });
$('#catGrid').addEventListener('click', e => { const a = e.target.closest('a[href="#deals"]'); if (a) { e.preventDefault(); if (lenis) lenis.scrollTo('#deals', { offset: -70, duration: 1.2 }); else $('#deals').scrollIntoView({ behavior: 'smooth' }); } });
$('#heroChips').addEventListener('click', e => { const b = e.target.closest('[data-cat-chip]'); if (b) { q.value = L(catOf(b.dataset.catChip)); q.focus(); openRes(); } });

const header = $('#header');
addEventListener('scroll', () => header.classList.toggle('is-scrolled', scrollY > 40), { passive: true });

/* ---------------- motion ---------------- */
let lenis = null, storyST = [];
function storyMotion() {
  storyST.forEach(s => s.kill()); storyST = [];
  const S = $$('.ss'), A = $$('.sa'), bars = $$('#stBars i');
  const wi = i => $$('.wi', S[i]), hl = i => $('.hl-m', S[i]);
  S.forEach((s, i) => { gsap.set(wi(i), { yPercent: i ? 110 : 0 }); if (hl(i)) gsap.set(hl(i), { '--hs': i ? '0%' : '100%' }); });
  A.forEach((a, i) => gsap.set(a, { opacity: i ? 0 : 1, scale: i ? .7 : 1, rotate: 0 }));
  bars.forEach(b => b.style.setProperty('--p', 0));
  // the first statement arrives as the section comes up
  // (it moves the wrappers, so it never fights the scroll timeline below, which moves the words themselves)
  const first = gsap.timeline({ scrollTrigger: { trigger: '#story', start: 'top 75%', toggleActions: 'play none none reverse' } })
    .from(S[0], { y: 60, opacity: 0, duration: 1, ease: 'expo.out' })
    .from($('.sa__t', A[0]), { scale: .6, rotate: -12, duration: 1.1, ease: 'back.out(1.6)' }, 0)
    .from($('.sa__chip', A[0]), { y: 20, opacity: 0, duration: .7, ease: 'back.out(2)' }, .4);
  storyST.push(first.scrollTrigger);
  // then the scroll swaps them: 1 → 2 → 3
  const tl = gsap.timeline({ scrollTrigger: { trigger: '#story', start: 'top top', end: 'bottom bottom', scrub: .8,
    onUpdate: st => { const n = Math.min(2, Math.floor(st.progress * 3)); $('#stN').textContent = '0' + (n + 1); } } });
  [0, 1, 2].forEach(i => tl.fromTo(bars[i], { '--p': 0 }, { '--p': 1, duration: 1, ease: 'none' }, i));
  [1, 2].forEach(i => {
    const at = i - .2;
    tl.to(wi(i - 1), { yPercent: -110, duration: .25, stagger: .01, ease: 'power2.in' }, at)
      .to(A[i - 1], { opacity: 0, scale: .7, rotate: 12, duration: .3, ease: 'power2.in' }, at);
    if (hl(i - 1)) tl.to(hl(i - 1), { '--hs': '0%', duration: .2, ease: 'power2.in' }, at);
    tl.to(wi(i), { yPercent: 0, duration: .35, stagger: .015, ease: 'power3.out' }, at + .25)
      .fromTo(A[i], { opacity: 0, scale: .7, rotate: -12 }, { opacity: 1, scale: 1, rotate: 0, duration: .4, ease: 'back.out(1.5)', immediateRender: false }, at + .22);
    if (hl(i)) tl.to(hl(i), { '--hs': '100%', duration: .3, ease: 'power2.inOut' }, at + .45);
  });
  storyST.push(tl.scrollTrigger);
}
function scrollMotion() {
  if (!G) return;
  ScrollTrigger.create({ trigger: '#catGrid', start: 'top 78%', once: true, onEnter: bentoIn });
  gsap.from('#catH, #cats .eyebrow', { y: 30, opacity: 0, duration: .9, stagger: .08, ease: 'power3.out', scrollTrigger: { trigger: '#cats', start: 'top 85%' } });
  gsap.from('.clr', { clipPath: 'inset(6% 4% 6% 4% round 48px)', duration: 1.3, ease: 'power3.out', scrollTrigger: { trigger: '#deals', start: 'top 85%' } });
  gsap.from('.clock__u', { y: 30, opacity: 0, rotateX: -60, duration: .9, stagger: .1, ease: 'back.out(1.8)', scrollTrigger: { trigger: '#clock', start: 'top 90%' } });
  gsap.from('#sbStage', { x: () => (lang === 'ar' ? -1 : 1) * innerWidth * .4, opacity: 0, duration: 1.4, ease: 'expo.out', clearProps: 'transform,opacity', scrollTrigger: { trigger: '#sb', start: 'top 85%' } });
  gsap.from('.sb__card', { y: 50, opacity: 0, duration: 1.1, ease: 'expo.out', clearProps: 'transform,opacity', scrollTrigger: { trigger: '#sb', start: 'top 80%' } });
  gsap.from('#fan', { y: 80, opacity: 0, scale: .94, duration: 1.2, ease: 'expo.out', clearProps: 'transform,opacity', scrollTrigger: { trigger: '#fan', start: 'top 88%' } });
  gsap.from('.soc', { clearProps: 'transform,opacity', y: 20, opacity: 0, duration: .8, stagger: .1, ease: 'back.out(2)', scrollTrigger: { trigger: '#exp', start: 'top 80%' } });
  ScrollTrigger.create({ trigger: '.stats', start: 'top 85%', once: true, onEnter: () => gsap.to(visShown, { month: vis.month, week: vis.week, now: vis.now, duration: 2.2, ease: 'power3.out', onUpdate: paintVis }) });
  gsap.from('.vis', { y: 60, opacity: 0, duration: 1.1, ease: 'power3.out', scrollTrigger: { trigger: '.vis', start: 'top 88%' } });
}

/* ---------------- the intro ---------------- */
function heroIn(t0 = 0) {
  if (!G) return;
  gsap.timeline({ delay: t0 })
    .from('#greet', { y: 20, opacity: 0, scale: .9, duration: .8, ease: 'back.out(2)' }, 0)
    .from('#heroH', { y: 40, opacity: 0, duration: 1, ease: 'expo.out' }, .05)
    .from('.hero__tx', { y: 24, opacity: 0, duration: .9, ease: 'expo.out', clearProps: 'transform,opacity' }, .12)
    .from('#heroChips', { y: 16, opacity: 0, duration: .8, ease: 'back.out(2)', clearProps: 'transform,opacity' }, .3)
    .from('.fl', { scale: .3, opacity: 0, duration: 1.1, stagger: .07, ease: 'back.out(1.6)', clearProps: 'transform,opacity' }, .3)
    .from('#logo .klogo__word', { y: 30, opacity: 0, duration: .9, ease: 'back.out(1.7)' }, 0);
}
function done() {
  root.classList.remove('is-intro');
  try { sessionStorage.setItem('ketHello', '1'); } catch (e) {}
  if (lenis) lenis.start();
  scrollMotion(); stopIdle();
  setInterval(cycleGreet, 3800);
  if (G) ScrollTrigger.refresh();
}
function runIntro() {
  scrollTo(0, 0);
  let seen = false; try { seen = !!sessionStorage.getItem('ketHello'); } catch (e) {}
  if (!G) { done(); return; }
  const hello = t('hello'), line = t('helloLine');
  $('#introHello').innerHTML = [...hello].map(c => `<span class="ch">${c}</span>`).join('') + '<span class="wave">👋🏼</span>';
  const typed = { n: 0 };
  const tl = gsap.timeline({ onComplete: finish });
  const box = () => $('#sField').getBoundingClientRect();
  if (!seen) {
    tl.from('#introHello .ch', { y: 80, opacity: 0, duration: .9, stagger: .06, ease: 'expo.out' }, .1)
      .from('#introHello .wave', { scale: 0, rotate: -40, duration: .8, ease: 'back.out(2.4)', onComplete: () => $('#introHello .wave').classList.add('is-on') }, .45)
      .to(typed, { n: line.length, duration: Math.min(1.6, line.length * .045), ease: 'none', onUpdate: () => { $('#introLine').innerHTML = esc(line.slice(0, Math.round(typed.n))) + '<span class="caret"></span>'; } }, 1.05)
      .to('#introWrap', { y: -40, opacity: 0, duration: .55, ease: 'power2.in' }, '+=.75');
  }
  tl.to('#introDots', { opacity: 1, duration: .3, onStart: () => $('#introDots').classList.add('is-on') }, seen ? .15 : '>-.05')
    .to({}, { duration: seen ? .55 : .9 })
    .add(() => $('#introDots').classList.remove('is-on'))
    .to('#introDots i:nth-child(1)', { x: () => -box().width * .18, duration: .45, ease: 'power3.inOut' })
    .to('#introDots i:nth-child(3)', { x: () => box().width * .18, duration: .45, ease: 'power3.inOut' }, '<')
    .set('#introPill', { opacity: 1 })
    .to('#introSkip', { opacity: 0, duration: .3 }, '<')
    .to('#introDots i', { x: 0, scale: .2, opacity: 0, duration: .35, ease: 'power3.in' })
    .to('#introPill', { width: () => box().width, height: () => box().height, left: () => box().left, top: () => box().top, margin: 0, duration: .9, ease: 'expo.inOut' }, '<.1')
    .to('#intro', { backgroundColor: 'rgba(0,0,0,0)', duration: .5 }, '-=.25')
    .add(() => heroIn(0), '-=.5')
    .to('#introPill', { opacity: 0, duration: .35 });
  function finish() { done(); }
  $('#introSkip').onclick = () => { tl.progress(1); };
}

/* ---------------- boot ---------------- */
applyLang();
setInterval(() => { renderClock(); tickDeals(); }, 1000);
if (G && window.Lenis) {
  lenis = new Lenis({ lerp: .11, smoothWheel: true });
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add(time => lenis.raf(time * 1000)); gsap.ticker.lagSmoothing(0);
  lenis.stop();
}
startAuto();
const fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 1200))]).then(runIntro);
})();
</script>
