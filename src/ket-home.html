<style>
/* ===================== TOKENS: light + dark ===================== */
:root{
  color-scheme:light;
  --bg:#F2F2F4; --surface:#fff; --surface-2:#F7F7F8; --text:#0B0B0B; --ink-2:#5B5B5B; --ink-3:#8A8A8A;
  --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.14); --well:#F4F4F4; --tile:#fff; --header-bg:rgba(255,255,255,.88);
  --invert:#0B0B0B; --on-invert:#fff; --shadow:0 24px 60px rgba(0,0,0,.08);
  --lime:#C6F7A6; --pink:#F4A7FC; --lime-l:#E9FCDD; --pink-l:#FCE6FE; --forest:#088040;
  --f-latin:'Inter Tight', system-ui, sans-serif;
  --f-ar:'IBM Plex Sans Arabic', 'Inter Tight', system-ui, sans-serif;
  --font:var(--f-ar);
  --gutter:16px; --section:clamp(72px, 10vw, 140px);
  --r-card:28px; --r-pill:999px;
  --ease:cubic-bezier(.16,1,.3,1);
  --header-h:60px; --dir:-1;
}
/* dark: the phone's setting, or the moon button */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D0E0D; --surface:#171817; --surface-2:#1F201F; --text:#F2F2EF; --ink-2:#ABABA6; --ink-3:#7C7C78;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16); --well:#EDECE8; --tile:#EDECE8; --header-bg:rgba(13,14,13,.84);
    --invert:#F2F2EF; --on-invert:#0B0B0B; --shadow:0 24px 60px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D0E0D; --surface:#171817; --surface-2:#1F201F; --text:#F2F2EF; --ink-2:#ABABA6; --ink-3:#7C7C78;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16); --well:#EDECE8; --tile:#EDECE8; --header-bg:rgba(13,14,13,.84);
  --invert:#F2F2EF; --on-invert:#0B0B0B; --shadow:0 24px 60px rgba(0,0,0,.45);
}
html[dir="ltr"]{ --dir:1; --font:var(--f-latin); }
@media (min-width:768px){ :root{ --gutter:32px; } }
@media (min-width:1200px){ :root{ --gutter:48px; --header-h:72px; } }

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; overflow-x:clip; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-size:16px; line-height:1.6; overflow-x:clip; -webkit-font-smoothing:antialiased; transition:background-color .4s, color .4s; }
img{ display:block; max-width:100%; height:auto; }
button, input{ font:inherit; color:inherit; background:none; border:0; padding:0; }
button{ cursor:pointer; }
a{ color:inherit; }
svg{ display:block; }
h1,h2,h3,p{ margin:0; }
ul{ margin:0; padding:0; list-style:none; }
.latin, .num{ font-family:var(--f-latin); }
.num{ font-variant-numeric:tabular-nums; }
.visually-hidden{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:focus-visible{ outline:2px solid var(--text); outline-offset:3px; border-radius:8px; }
.skip{ position:fixed; inset-inline-start:12px; top:-60px; z-index:300; background:var(--invert); color:var(--on-invert); padding:10px 16px; border-radius:var(--r-pill); text-decoration:none; transition:top .3s var(--ease); }
.skip:focus{ top:12px; }
.container{ width:100%; max-width:1440px; margin-inline:auto; padding-inline:var(--gutter); }
.section{ padding-top:var(--section); }
html[dir="rtl"] .flip svg{ transform:scaleX(-1); }

.eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
html[lang="en"] .eyebrow{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
.eyebrow::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--pink); }
.h2{ font-size:clamp(32px, 4.4vw, 60px); font-weight:600; line-height:1.05; letter-spacing:-.035em; }
html[lang="ar"] .h2{ font-weight:700; line-height:1.3; letter-spacing:0; }
.sub{ color:var(--ink-2); font-size:clamp(15px, 1.2vw, 17px); max-width:46ch; }
.head{ display:grid; gap:14px; margin-bottom:clamp(28px, 4vw, 52px); }
.icon-btn{ display:inline-grid; place-items:center; width:44px; height:44px; border-radius:var(--r-pill); transition:background-color .25s; }
.icon-btn:hover{ background:var(--line); }
.btn{ position:relative; display:inline-flex; align-items:center; justify-content:center; gap:10px; height:52px; padding-inline:22px; border-radius:var(--r-pill); font-weight:600; font-size:15px; white-space:nowrap; text-decoration:none; transition:transform .4s var(--ease), background-color .3s; }
.btn:active{ transform:scale(.97); }
.btn-ink{ background:var(--invert); color:var(--on-invert); }
.btn-lime{ background:var(--lime); color:#0B0B0B; }

/* ===================== INTRO: Hello 👋 → typed welcome → dots → the search bar ===================== */
.intro{ position:fixed; inset:0; z-index:200; background:var(--bg); display:grid; place-items:center; overflow:hidden; }
html:not(.is-intro) .intro, .no-motion .intro{ display:none; }
html.is-intro body{ overflow:hidden; }
.intro__wrap{ display:grid; justify-items:center; gap:clamp(14px, 2vw, 24px); text-align:center; padding-inline:24px; }
.intro__hello{ display:flex; align-items:flex-start; gap:.08em; font:700 clamp(84px, 16vw, 200px)/.9 var(--f-latin); letter-spacing:-.06em; direction:ltr; }
.intro__hello .ch{ display:inline-block; }
.wave{ display:inline-block; font-size:.62em; line-height:1; margin-top:-.12em; transform-origin:70% 80%; }
.wave.is-on{ animation:wave 1.6s ease-in-out infinite; }
@keyframes wave{ 0%,60%,100%{ transform:rotate(0); } 10%{ transform:rotate(16deg); } 20%{ transform:rotate(-10deg); } 30%{ transform:rotate(16deg); } 40%{ transform:rotate(-6deg); } 50%{ transform:rotate(10deg); } }
.intro__line{ min-height:1.6em; font-size:clamp(20px, 2.6vw, 32px); font-weight:600; }
.intro__line .caret{ display:inline-block; width:2px; height:1em; margin-inline-start:3px; vertical-align:-.12em; background:var(--text); animation:caret .8s steps(1) infinite; }
@keyframes caret{ 50%{ opacity:0; } }
.intro__dots{ position:absolute; left:50%; top:50%; display:flex; gap:10px; transform:translate(-50%, -50%); opacity:0; }
.intro__dots i{ width:16px; height:16px; border-radius:50%; background:var(--lime); }
.intro__dots i:nth-child(2){ background:var(--pink); }
.intro__dots.is-on i{ animation:dot 1s var(--ease) infinite; }
.intro__dots.is-on i:nth-child(2){ animation-delay:.12s; } .intro__dots.is-on i:nth-child(3){ animation-delay:.24s; }
@keyframes dot{ 0%,100%{ transform:translateY(0); opacity:.45; } 40%{ transform:translateY(-10px); opacity:1; } }
.intro__pill{ position:fixed; left:50%; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:999px; background:var(--surface); box-shadow:0 0 0 2px var(--lime), 0 0 40px rgba(198,247,166,.7); opacity:0; }
.intro__skip{ position:absolute; bottom:calc(20px + env(safe-area-inset-bottom)); inset-inline-end:20px; font-size:13px; font-weight:600; padding:8px 16px; border-radius:var(--r-pill); border:1px solid var(--line-2); opacity:.75; }
.intro__skip:hover{ opacity:1; }

/* ===================== ANNOUNCEMENT + HEADER ===================== */
.announce{ position:relative; z-index:61; background:var(--forest); color:#fff; height:36px; overflow:hidden; display:flex; align-items:center; font-size:13px; font-weight:500; }
.marquee{ display:flex; width:max-content; animation:marquee 32s linear infinite; }
.marquee__group{ display:flex; align-items:center; gap:28px; padding-inline-end:28px; white-space:nowrap; }
.marquee__group span{ display:inline-flex; align-items:center; gap:28px; }
.marquee__group span::after{ content:""; width:5px; height:5px; border-radius:50%; background:#fff; }
@keyframes marquee{ to{ transform:translateX(calc(50% * var(--dir) * -1)); } }
.header{ position:sticky; top:0; z-index:60; background:var(--header-bg); -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid transparent; transition:border-color .35s, background-color .4s; }
.header.is-scrolled{ border-bottom-color:var(--line); }
.header__inner{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; height:var(--header-h); }
.header__start, .header__end{ display:flex; align-items:center; gap:2px; }
.header__end{ justify-content:flex-end; }
.logo{ display:block; color:var(--text); text-decoration:none; }
.logo svg{ width:64px; height:auto; overflow:visible; }
.klogo .kl{ transform-box:fill-box; transform-origin:50% 100%; transition:transform .6s var(--ease), opacity .35s var(--ease); }
.klogo__smile{ transform-box:fill-box; transform-origin:50% 50%; opacity:0; clip-path:inset(0 50% 0 50%); transform:translateY(-10%) scale(.7); transition:clip-path .55s var(--ease), opacity .25s, transform .6s var(--ease); }
.header.is-scrolled .klogo .kl{ transform:translateY(10%) scale(.2, .04); opacity:0; }
.header.is-scrolled .klogo .klogo__smile{ opacity:1; clip-path:inset(0 0 0 0); transform:translateY(-34%) scale(1.18); transition-delay:.18s; }
.nav{ display:none; gap:4px; margin-inline-start:6px; }
.nav a{ height:36px; padding-inline:12px; display:inline-flex; align-items:center; border-radius:var(--r-pill); font-size:14px; font-weight:500; text-decoration:none; transition:background-color .25s; }
.nav a:hover{ background:var(--line); }
@media (min-width:1100px){ .nav{ display:flex; } }
.lang-btn{ height:36px; padding-inline:14px; border-radius:var(--r-pill); border:1px solid var(--text); font-size:13px; font-weight:600; margin-inline-start:6px; transition:background-color .25s, color .25s; }
.lang-btn:hover{ background:var(--invert); color:var(--on-invert); }
.cart-btn{ position:relative; }
.cart-count{ position:absolute; top:4px; inset-inline-end:2px; min-width:18px; height:18px; padding-inline:5px; border-radius:var(--r-pill); background:var(--pink); color:#000; font:600 11px/18px var(--f-latin); text-align:center; transform:scale(0); transition:transform .4s var(--ease); }
.cart-count.has-items{ transform:scale(1); }
.cart-count.bump{ animation:bump .5s var(--ease); }
@keyframes bump{ 40%{ transform:scale(1.45); } }
@media (max-width:767px){ .hide-mob{ display:none!important; } }

/* ===================== 1. HERO: greeting + the smart search ===================== */
.hero{ position:relative; min-height:calc(100svh - 36px - var(--header-h)); display:grid; grid-template-rows:1fr auto; justify-items:center; align-items:center; padding-block:clamp(18px, 3.5vh, 48px) clamp(10px, 2vh, 22px); }
.hero__in{ position:relative; z-index:5; width:min(100%, 820px); display:grid; justify-items:center; text-align:center; gap:clamp(16px, 2.2vw, 24px); }
.greet{ display:inline-flex; align-items:center; gap:10px; height:44px; padding-inline:8px 18px; border-radius:var(--r-pill); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); font-weight:600; font-size:15px; }
.greet .wave{ font-size:20px; display:grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--lime-l); }
.greet__txt{ display:inline-block; min-width:12ch; }
.hero__h{ font-size:clamp(36px, 5.4vw, 78px); font-weight:600; line-height:1.02; letter-spacing:-.045em; }
html[lang="ar"] .hero__h{ font-weight:700; line-height:1.25; letter-spacing:0; }
.hero__tx{ color:var(--ink-2); font-size:clamp(15px, 1.3vw, 18px); max-width:44ch; }

/* the search box: a moving light around the frame (green + pink), a small AI spark, typed hints */
.sbox{ position:relative; z-index:20; width:100%; isolation:isolate; margin-top:6px; }
.sbox__input::-webkit-search-cancel-button, .sbox__input::-webkit-search-decoration{ -webkit-appearance:none; appearance:none; }
.sbox__frame{ position:relative; border-radius:var(--r-pill); padding:1.5px; background:linear-gradient(90deg, var(--lime), var(--pink), var(--lime), var(--pink), var(--lime)); background-size:200% 100%; animation:flow 7s linear infinite; box-shadow:0 18px 44px rgba(0,0,0,.06); }
.sbox__frame::after{ content:""; position:absolute; z-index:-1; inset:40% 8% -26%; border-radius:50%; background:radial-gradient(45% 70% at 28% 50%, rgba(198,247,166,.95), transparent 72%), radial-gradient(45% 70% at 72% 50%, rgba(244,167,252,.9), transparent 72%); filter:blur(26px); opacity:.55; animation:breathe 5s ease-in-out infinite; transition:opacity .5s; pointer-events:none; }
@keyframes flow{ to{ background-position:-200% 0; } }
@keyframes breathe{ 50%{ transform:scale(1.08, 1.15); } }
.sbox.is-idle .sbox__frame{ animation-duration:2.6s; }
.sbox.is-idle .sbox__frame::after{ opacity:1; animation-duration:2.2s; }
.sbox.is-focus .sbox__frame::after{ opacity:.85; }
.sbox__field{ position:relative; display:flex; align-items:center; gap:10px; height:clamp(62px, 6vw, 76px); padding-inline:16px 8px; border-radius:var(--r-pill); background:var(--surface); }
.ai{ position:relative; width:34px; height:34px; flex:none; display:grid; place-items:center; }
.ai svg{ width:26px; height:26px; animation:aiSpin 7s var(--ease) infinite; }
.ai .ai__s{ position:absolute; top:1px; inset-inline-end:0; width:11px; height:11px; animation:aiTw 2.4s ease-in-out infinite; }
@keyframes aiSpin{ 0%,70%{ transform:rotate(0) scale(1); } 80%{ transform:rotate(90deg) scale(.86); } 90%,100%{ transform:rotate(180deg) scale(1); } }
@keyframes aiTw{ 0%,100%{ transform:scale(.4); opacity:.3; } 50%{ transform:scale(1); opacity:1; } }
.sbox.is-idle .ai svg{ animation-duration:2.6s; }
.sbox__input{ flex:1; min-width:0; height:100%; font-size:clamp(16px, 1.5vw, 19px); font-weight:500; outline:0; }
.sbox__input::placeholder{ color:transparent; }
.sbox__ph{ position:absolute; inset-inline-start:60px; inset-inline-end:130px; top:50%; transform:translateY(-50%); color:var(--ink-3); font-size:clamp(16px, 1.5vw, 19px); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; text-align:start; }
.sbox__ph .caret{ display:inline-block; width:2px; height:1.05em; margin-inline-start:2px; vertical-align:-.15em; background:var(--ink-3); animation:caret .8s steps(1) infinite; }
.sbox.has-text .sbox__ph{ opacity:0; }
.sbox__clear{ width:36px; height:36px; border-radius:50%; display:none; place-items:center; color:var(--ink-2); flex:none; }
.sbox.has-text .sbox__clear{ display:grid; }
.sbox__clear:hover{ background:var(--line); }
.sbox__go{ height:calc(100% - 4px); aspect-ratio:1; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--invert); color:var(--on-invert); transition:transform .4s var(--ease); }
@media (min-width:640px){ .sbox__go{ aspect-ratio:auto; padding-inline:20px 8px; gap:10px; display:inline-flex; align-items:center; font-weight:600; font-size:15px; } .sbox__go i{ width:38px; height:38px; border-radius:50%; background:var(--lime); color:#0B0B0B; display:grid; place-items:center; } }
@media (max-width:639px){ .sbox__go span{ display:none; } .sbox__go i{ display:grid; place-items:center; } .sbox__ph{ inset-inline-end:62px; } }
.sbox__go:hover{ transform:scale(1.03); }
.sbox__tip{ position:absolute; bottom:calc(100% + 14px); inset-inline-end:clamp(20px, 8%, 90px); padding:9px 14px; border-radius:16px; background:var(--invert); color:var(--on-invert); font-size:14px; font-weight:600; white-space:nowrap; opacity:0; transform:translateY(8px) scale(.9); transition:opacity .4s, transform .5s var(--ease); pointer-events:none; }
.sbox__tip::after{ content:""; position:absolute; top:100%; inset-inline-end:26px; border:7px solid transparent; border-top-color:var(--invert); }
.sbox.is-idle .sbox__tip{ opacity:1; transform:none; animation:tipBob 2.4s ease-in-out infinite; }
@keyframes tipBob{ 50%{ transform:translateY(-4px); } }
@media (max-width:639px){ .sbox__tip{ display:none; } }

/* suggestions */
.sres{ position:absolute; z-index:30; top:calc(100% + 10px); inset-inline:0; max-height:min(62vh, 480px); overflow:auto; overscroll-behavior:contain; border-radius:26px; background:var(--surface); box-shadow:var(--shadow), inset 0 0 0 1px var(--line); padding:10px; text-align:start; opacity:0; visibility:hidden; transform:translateY(-6px); transition:opacity .25s, transform .35s var(--ease), visibility 0s .35s; }
.sbox.is-open .sres{ opacity:1; visibility:visible; transform:none; transition:opacity .25s, transform .35s var(--ease); }
.sres h4{ margin:8px 10px 6px; font-size:12px; font-weight:600; color:var(--ink-3); }
html[lang="en"] .sres h4{ text-transform:uppercase; letter-spacing:.08em; }
.sres__chips{ display:flex; flex-wrap:wrap; gap:6px; padding:2px 8px 8px; }
.chip{ display:inline-flex; align-items:center; gap:6px; height:36px; padding-inline:14px; border-radius:var(--r-pill); background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line); font-size:14px; font-weight:500; white-space:nowrap; transition:background-color .25s, transform .3s var(--ease); }
.chip:hover, .chip.is-act{ background:var(--lime); color:#0B0B0B; box-shadow:none; }
.chip svg{ opacity:.6; }
.srow{ display:grid; grid-template-columns:56px 1fr auto; align-items:center; gap:12px; width:100%; padding:8px; border-radius:16px; text-align:start; transition:background-color .2s; }
.srow:hover, .srow.is-act{ background:var(--surface-2); }
.srow__img{ width:56px; height:56px; border-radius:14px; background:var(--well); overflow:hidden; }
.srow__img img{ width:100%; height:100%; object-fit:contain; mix-blend-mode:multiply; padding:6px; }
.srow b{ display:block; font-weight:600; font-size:15px; line-height:1.35; }
.srow b mark{ background:var(--lime); color:#0B0B0B; border-radius:4px; padding-inline:1px; }
.srow small{ display:block; color:var(--ink-3); font-size:12.5px; }
.srow__p{ text-align:end; font:600 15px/1.2 var(--f-latin); white-space:nowrap; }
.srow__p s{ display:block; font-weight:400; font-size:12px; color:var(--ink-3); }
.srow__p em{ font-style:normal; font-size:11px; color:var(--ink-2); margin-inline-start:3px; }
.sres__none{ padding:22px 14px; text-align:center; color:var(--ink-2); }
.sres__all{ display:flex; justify-content:center; width:100%; padding:12px; margin-top:4px; border-radius:16px; font-weight:600; font-size:14px; background:var(--surface-2); }
.sres__all:hover{ background:var(--lime); color:#0B0B0B; }

.hero__chips{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
.hero__chips .chip{ background:var(--surface); }

/* a slow strip of products along the bottom of the hero (stops on hover, tap opens the product) */
.ribbon{ width:100vw; margin-inline:calc(50% - 50vw); margin-top:clamp(18px, 3vh, 40px); overflow:hidden; padding-block:10px 6px; -webkit-mask-image:linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); mask-image:linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); }
.ribbon__track{ display:flex; width:max-content; animation:marquee 70s linear infinite; }
.ribbon:hover .ribbon__track{ animation-play-state:paused; }
.ribbon__g{ display:flex; gap:14px; padding-inline-end:14px; }
.rb{ flex:none; position:relative; display:block; width:clamp(100px, min(9vw, 15vh), 136px); aspect-ratio:1; border-radius:clamp(24px, 2.4vw, 32px); background:var(--tile); box-shadow:inset 0 0 0 1px var(--line); overflow:hidden; transition:transform .5s var(--ease); }
.rb img{ width:100%; height:100%; object-fit:contain; mix-blend-mode:multiply; padding:13%; transition:transform .7s var(--ease); }
.rb--l{ background:var(--lime); box-shadow:none; } .rb--p{ background:var(--pink); box-shadow:none; }
.rb:hover{ transform:translateY(-6px); } .rb:hover img{ transform:scale(1.08); }
.rb__p{ position:absolute; bottom:8px; inset-inline-start:8px; height:24px; padding-inline:8px; border-radius:999px; background:rgba(255,255,255,.94); color:#0B0B0B; font:600 11.5px/24px var(--f-latin); opacity:0; transform:translateY(6px); transition:opacity .35s, transform .45s var(--ease); }
.rb:hover .rb__p{ opacity:1; transform:none; }
@media (hover:none){ .rb__p{ opacity:1; transform:none; } }

/* ===================== 2. ABOUT: one statement at a time, each with its own piece (sticky while you scroll) ===================== */
.story{ position:relative; height:320vh; }
.story__pin{ position:sticky; top:var(--header-h); height:calc(100svh - var(--header-h)); display:grid; align-content:center; align-items:center; gap:clamp(22px, 5vw, 90px); }
@media (min-width:900px){ .story__pin{ grid-template-columns:1.3fr 1fr; } }
.story__copy{ display:grid; gap:clamp(18px, 2.4vw, 30px); }
.story__meta{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
.story__count{ font-size:14px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.story__count b{ color:var(--text); }
.story__slides{ display:grid; }
.ss{ grid-area:1 / 1; font-size:clamp(34px, 5vw, 80px); font-weight:600; line-height:1.08; letter-spacing:-.045em; }
html[lang="ar"] .ss{ font-weight:700; line-height:1.4; letter-spacing:0; }
.wm{ display:inline-block; overflow:hidden; vertical-align:top; padding-block:.14em; margin-block:-.14em; }
.wi{ display:inline-block; will-change:transform; }
.hl-m{ background:linear-gradient(var(--lime), var(--lime)) no-repeat; background-size:var(--hs, 100%) 76%; background-position:0 60%; border-radius:.16em; padding-inline:.1em; margin-inline:-.04em; color:#0B0B0B; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
html[dir="rtl"] .hl-m{ background-position:100% 60%; }
.hl-p{ color:var(--pink); }
.story__bars{ display:flex; gap:8px; }
.story__bars i{ position:relative; flex:1; max-width:90px; height:4px; border-radius:4px; background:var(--line-2); overflow:hidden; }
.story__bars i::after{ content:""; position:absolute; inset:0; border-radius:inherit; background:var(--text); transform:scaleX(var(--p, 0)); transform-origin:left; }
html[dir="rtl"] .story__bars i::after{ transform-origin:right; }
.story__art{ position:relative; width:min(100%, 500px); aspect-ratio:1; justify-self:center; }
.sa{ position:absolute; inset:0; display:grid; place-items:center; }
.sa__t{ width:86%; height:86%; background:var(--bg-t); overflow:hidden; box-shadow:var(--shadow); }
.sa__t img{ width:100%; height:100%; object-fit:contain; mix-blend-mode:multiply; padding:13%; }
.sa__t.sh-c{ border-radius:50%; } .sa__t.sh-a{ border-radius:999px 999px 36px 36px; width:72%; } .sa__t.sh-p{ border-radius:999px; width:62%; }
.sa__chip{ position:absolute; bottom:10%; inset-inline-start:2%; display:flex; align-items:center; gap:10px; padding:8px 16px 8px 8px; border-radius:var(--r-pill); background:var(--surface); box-shadow:var(--shadow), inset 0 0 0 1px var(--line); font-size:14px; font-weight:600; white-space:nowrap; }
html[dir="rtl"] .sa__chip{ padding:8px 8px 8px 16px; }
.sa__chip i{ width:34px; height:34px; border-radius:50%; background:var(--lime); color:#0B0B0B; display:grid; place-items:center; }
.sa__chip small{ display:block; font:600 12px/1.2 var(--f-latin); color:var(--ink-2); }
@media (max-width:899px){
  .story{ height:300vh; }
  .story__art{ order:-1; width:min(64vw, 290px); }
  .story__copy{ text-align:center; } .story__meta{ justify-content:center; gap:14px; } .story__bars{ justify-content:center; }
  .ss{ font-size:clamp(28px, 8vw, 44px); }
  .sa__chip{ font-size:12.5px; bottom:2%; }
}
.no-motion .story{ height:auto; padding-block:var(--section); }
.no-motion .story__pin{ position:static; height:auto; }
.no-motion .story__slides{ gap:20px; } .no-motion .ss{ grid-area:auto; }
.no-motion .sa:not(:first-child), .no-motion .story__bars, .no-motion .story__count{ display:none; }

/* ===================== 3. DEPARTMENTS ===================== */
.cats{ display:grid; gap:14px; grid-template-columns:1fr 1fr; }
.cat{ position:relative; display:flex; flex-direction:column; justify-content:space-between; gap:12px; min-height:clamp(230px, 26vw, 330px); padding:clamp(16px, 2vw, 26px); border-radius:var(--r-card); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); overflow:hidden; text-decoration:none; isolation:isolate; text-align:start; transition:transform .5s var(--ease), box-shadow .5s; }
.cat:hover{ transform:translateY(-4px); box-shadow:inset 0 0 0 1px var(--line), var(--shadow); }
.cat:first-child{ grid-column:1 / -1; min-height:clamp(260px, 32vw, 420px); }
.cat__copy{ position:relative; z-index:2; display:grid; gap:4px; max-width:58%; }
.cat h3{ font-size:clamp(20px, 2vw, 30px); font-weight:600; letter-spacing:-.03em; line-height:1.15; }

.cat:hover .cat__art img:nth-child(1){ transform:translate(calc(-4% * var(--dir)), -3%) scale(1.06); }

@media (max-width:767px){

}
@media (min-width:1024px){

}

/* ===================== 4. 24-HOUR CLEARANCE (3D carousel) ===================== */
.clr{ position:relative; border-radius:clamp(28px, 4vw, 48px); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); padding:clamp(22px, 4vw, 56px) 0 clamp(26px, 4vw, 52px); overflow:hidden; }
.clr__head{ display:grid; gap:18px; padding-inline:clamp(18px, 4vw, 56px); margin-bottom:clamp(8px, 2vw, 24px); }
@media (min-width:1024px){ .clr__head{ grid-template-columns:1fr auto; align-items:end; } }
.clr__ey{ display:inline-flex; align-items:center; gap:8px; justify-self:start; height:32px; padding-inline:10px 14px; border-radius:var(--r-pill); background:var(--pink); color:#0B0B0B; font-size:13px; font-weight:700; }
.clr__ey .fire{ animation:fire 1.2s ease-in-out infinite alternate; display:inline-block; }
@keyframes fire{ to{ transform:scale(1.2) rotate(-6deg); } }
.clock{ display:flex; align-items:center; gap:8px; direction:ltr; }
.clock__u{ display:grid; justify-items:center; gap:4px; }
.clock__u b{ display:grid; place-items:center; min-width:clamp(62px, 6vw, 84px); height:clamp(62px, 6vw, 84px); padding-inline:8px; border-radius:20px; background:var(--invert); color:var(--on-invert); font:700 clamp(30px, 3vw, 44px)/1 var(--f-latin); font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
.clock__u:last-child b{ background:var(--lime); color:#0B0B0B; }
.clock__u small{ font-size:12px; color:var(--ink-2); }
.clock__sep{ font:700 30px/1 var(--f-latin); color:var(--ink-3); margin-bottom:22px; animation:caret 1s steps(1) infinite; }

.car{ position:relative; height:clamp(500px, 52vw, 600px); perspective:1400px; touch-action:pan-y; user-select:none; -webkit-user-select:none; cursor:grab; }
.car.is-drag{ cursor:grabbing; }
.car__track{ position:absolute; inset:0; transform-style:preserve-3d; }
.dl{ position:absolute; left:50%; top:50%; width:clamp(270px, 25vw, 330px); margin-left:calc(clamp(270px, 25vw, 330px) / -2); translate:0 -50%; border-radius:30px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line), 0 30px 60px rgba(0,0,0,.12); padding:10px; text-align:start; will-change:transform; backface-visibility:hidden; }
.dl::after{ content:""; position:absolute; inset:0; border-radius:inherit; background:var(--bg); opacity:var(--dim, 0); pointer-events:none; }
.dl__media{ position:relative; aspect-ratio:1 / .92; border-radius:22px; background:var(--well); overflow:hidden; }
.dl__media img{ width:100%; height:100%; object-fit:contain; mix-blend-mode:multiply; padding:9%; pointer-events:none; }
.dl__off{ position:absolute; top:10px; inset-inline-start:10px; width:68px; height:68px; border-radius:50%; background:var(--pink); color:#0B0B0B; display:grid; place-content:center; text-align:center; font:800 20px/1 var(--f-latin); letter-spacing:-.04em; transform:rotate(-8deg); }
.dl__off small{ font-size:10px; font-weight:700; letter-spacing:0; }
.dl__tag{ position:absolute; bottom:10px; inset-inline-start:10px; display:inline-flex; align-items:center; gap:6px; height:28px; padding-inline:10px; border-radius:var(--r-pill); background:var(--lime); color:#0B0B0B; font-size:12px; font-weight:700; }
.dl__time{ position:absolute; top:12px; inset-inline-end:12px; height:28px; padding-inline:10px; border-radius:var(--r-pill); background:rgba(255,255,255,.9); color:#0B0B0B; font:600 12px/28px var(--f-latin); font-variant-numeric:tabular-nums; unicode-bidi:isolate; }
.dl__body{ display:grid; gap:8px; padding:14px 8px 6px; }
.dl__name{ font-weight:600; font-size:16px; line-height:1.35; }
.dl__price{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.dl__price b{ font:800 clamp(34px, 3vw, 42px)/1 var(--f-latin); letter-spacing:-.04em; }
.dl__price b small{ font-size:.38em; font-weight:600; margin-inline-start:4px; letter-spacing:0; }
.dl__price s{ font:500 16px/1 var(--f-latin); color:var(--ink-3); }
.dl__save{ font-size:12px; font-weight:700; color:var(--forest); }
:root[data-theme="dark"] .dl__save{ color:var(--lime); }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .dl__save{ color:var(--lime); } }
.stock{ display:grid; gap:6px; }
.stock span{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; }
.stock span::before{ content:""; width:8px; height:8px; border-radius:50%; background:#FF5A3C; animation:ping 1.4s infinite; }
@keyframes ping{ 0%{ box-shadow:0 0 0 0 rgba(255,90,60,.5); } 100%{ box-shadow:0 0 0 8px rgba(255,90,60,0); } }
.stock i{ display:block; height:7px; border-radius:7px; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line); overflow:hidden; }
.stock i::after{ content:""; display:block; height:100%; width:var(--w); border-radius:inherit; background:linear-gradient(90deg, var(--pink), #F07BFF); }
.dl__buy{ width:100%; margin-top:6px; height:52px; }
.dl.is-ended{ filter:grayscale(1); opacity:.5; }
.car__nav{ display:flex; justify-content:center; align-items:center; gap:14px; margin-top:4px; }
.car__btn{ width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line); transition:background-color .25s, transform .4s var(--ease); }
.car__btn:hover{ background:var(--lime); color:#0B0B0B; }
.car__btn:active{ transform:scale(.92); }
.car__dots{ display:flex; gap:6px; }
.car__dots button{ width:8px; height:8px; border-radius:8px; background:var(--line-2); transition:width .4s var(--ease), background-color .3s; }
.car__dots button.is-on{ width:26px; background:var(--text); }

/* ===================== 5. CUSTOMER VIDEOS ===================== */
.exp__head{ display:grid; gap:18px; margin-bottom:clamp(24px, 3vw, 40px); }
@media (min-width:1024px){ .exp__head{ grid-template-columns:1fr auto; align-items:end; } }
.socials{ display:flex; flex-wrap:wrap; gap:10px; }
.soc{ display:inline-flex; align-items:center; gap:10px; height:52px; padding-inline:8px 18px; border-radius:var(--r-pill); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); text-decoration:none; font-weight:600; font-size:14px; transition:transform .4s var(--ease); }
.soc:hover{ transform:translateY(-3px); }
.soc i{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:#fff; }
.soc--ig i{ background:radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
.soc--tt i{ background:#000; box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
.vrail{ display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; padding-block:10px 24px; padding-inline:var(--gutter); scroll-padding-inline:var(--gutter); }
.vrail::-webkit-scrollbar{ display:none; }
.vc{ position:relative; flex:none; width:clamp(200px, 21vw, 270px); aspect-ratio:9 / 16; border-radius:26px; overflow:hidden; scroll-snap-align:center; background:#222; text-align:start; transform:translateZ(0); transition:transform .6s var(--ease); }
.vc:hover{ transform:translateY(-6px) rotate(calc(-1deg * var(--dir))); }
.vc img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation:kb 14s ease-in-out infinite alternate; }
.vc:nth-child(even) img{ animation-delay:-7s; }
@keyframes kb{ from{ transform:scale(1.02); } to{ transform:scale(1.14) translate(2%, -2%); } }
.vc::after{ content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.6), transparent 45%, transparent 75%, rgba(0,0,0,.25)); }
.vc__top{ position:absolute; z-index:2; top:12px; inset-inline:12px; display:flex; justify-content:space-between; align-items:center; color:#fff; font-size:12px; font-weight:600; }
.vc__tag{ display:inline-flex; align-items:center; gap:6px; height:26px; padding-inline:10px; border-radius:var(--r-pill); background:rgba(255,255,255,.2); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.vc__tag::before{ content:"🤍"; font-size:11px; }
.vc__play{ position:absolute; z-index:2; left:50%; top:50%; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.28); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); color:#fff; transition:transform .5s var(--ease), background-color .3s; }
.vc__play::before{ content:""; position:absolute; inset:-6px; border-radius:50%; border:1.5px solid rgba(255,255,255,.5); animation:ring 2.2s var(--ease) infinite; }
@keyframes ring{ from{ transform:scale(.85); opacity:1; } to{ transform:scale(1.35); opacity:0; } }
.vc:hover .vc__play{ transform:scale(1.1); background:var(--lime); color:#0B0B0B; }
.vc__bot{ position:absolute; z-index:2; bottom:12px; inset-inline:12px; display:flex; align-items:center; gap:10px; padding:6px; padding-inline-end:12px; border-radius:18px; background:rgba(255,255,255,.92); color:#0B0B0B; }
.vc__bot img{ position:static; width:40px; height:40px; border-radius:12px; background:#F4F4F4; object-fit:contain; mix-blend-mode:multiply; padding:3px; animation:none; }
.vc__bot b{ display:block; font-size:13px; line-height:1.3; }
.vc__bot small{ font:600 12px/1 var(--f-latin); color:#555; }
.vbox{ border:0; padding:0; background:transparent; max-width:none; max-height:none; overflow:visible; }
.vbox::backdrop{ background:rgba(0,0,0,.72); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.vbox__in{ position:relative; width:min(92vw, 400px); aspect-ratio:9 / 16; max-height:86svh; border-radius:28px; overflow:hidden; background:#111; color:#fff; }
.vbox__in img, .vbox__in video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.vbox__in img{ animation:kb 10s ease-in-out infinite alternate; }
.vbox__note{ position:absolute; z-index:2; inset-inline:14px; bottom:14px; padding:12px 14px; border-radius:16px; background:rgba(0,0,0,.55); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); font-size:13px; text-align:center; }
.vbox__bar{ position:absolute; z-index:2; top:12px; inset-inline:14px; height:3px; border-radius:3px; background:rgba(255,255,255,.3); overflow:hidden; }
.vbox__bar::after{ content:""; display:block; height:100%; width:100%; background:#fff; transform-origin:left; animation:bar 8s linear infinite; }
html[dir="rtl"] .vbox__bar::after{ transform-origin:right; }
@keyframes bar{ from{ transform:scaleX(0); } }
.vbox__x{ position:absolute; z-index:3; top:24px; inset-inline-end:14px; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.2); color:#fff; }

/* ===================== 6. VISITORS + the little shopping scene ===================== */
.vis{ position:relative; border-radius:clamp(28px, 4vw, 48px); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); overflow:hidden; padding-top:clamp(28px, 4vw, 56px); }
.vis__head{ display:grid; gap:12px; justify-items:center; text-align:center; padding-inline:20px; }
.stats{ display:grid; grid-template-columns:repeat(3, 1fr); gap:clamp(8px, 2vw, 24px); max-width:900px; margin:clamp(24px, 3vw, 40px) auto 0; padding-inline:16px; text-align:center; }
.stat b{ display:block; font:700 clamp(28px, 4.6vw, 62px)/1 var(--f-latin); letter-spacing:-.045em; font-variant-numeric:tabular-nums; }
.stat span{ display:inline-flex; align-items:center; gap:6px; margin-top:8px; font-size:clamp(12px, 1.1vw, 15px); color:var(--ink-2); }
.stat--now b{ color:var(--text); }
.stat--now span::before{ content:""; width:8px; height:8px; border-radius:50%; background:#2BD46B; box-shadow:0 0 0 0 rgba(43,212,107,.5); animation:ping2 1.6s infinite; }
@keyframes ping2{ to{ box-shadow:0 0 0 9px rgba(43,212,107,0); } }
.scene{ position:relative; height:clamp(210px, 22vw, 290px); margin-top:clamp(18px, 3vw, 36px); color:var(--text); }
.scene__ground{ position:absolute; inset-inline:0; bottom:22px; height:1.5px; background:var(--line-2); }
.scene__deco{ position:absolute; bottom:calc(70px * var(--m, 1)); opacity:.4; }
@media (max-width:767px){ .scene{ --m:.62; height:170px; } .scene__deco svg{ transform:scale(.7); transform-origin:bottom; } }
.walker{ position:absolute; bottom:calc(var(--b, 12px) * var(--m, 1)); left:0; width:calc(170px * var(--k) * var(--m, 1)); animation:walk var(--dur) linear infinite; animation-delay:var(--del); will-change:transform; }
.walker svg{ width:100%; height:auto; overflow:visible; }
.walker.is-back svg{ transform:scaleX(-1); }
@keyframes walk{ from{ transform:translateX(calc(-200px)); } to{ transform:translateX(calc(var(--sw, 1400px) + 20px)); } }
.walker.is-back{ animation-name:walkBack; }
@keyframes walkBack{ from{ transform:translateX(calc(var(--sw, 1400px) + 20px)); } to{ transform:translateX(-200px); } }
.scene.is-paused .walker, .scene.is-paused .walker *{ animation-play-state:paused!important; }
.leg{ transform-box:view-box; transform-origin:37px 72px; animation:leg .7s ease-in-out infinite alternate; }
.leg--b{ animation-delay:-.7s; }
@keyframes leg{ from{ transform:rotate(18deg); } to{ transform:rotate(-18deg); } }
.bob{ animation:bob .35s ease-in-out infinite alternate; }
@keyframes bob{ to{ transform:translateY(-2px); } }
.wheel{ transform-box:fill-box; transform-origin:center; animation:wheel .8s linear infinite; }
@keyframes wheel{ to{ transform:rotate(360deg); } }
.walker.is-back .wheel{ animation-direction:reverse; }
.ink-s{ stroke:currentColor; } .ink-f{ fill:currentColor; } .srf{ fill:var(--surface); }

/* ===================== FOOTER (as the tables page) ===================== */
.footer{ background:var(--forest); color:#fff; padding-block:48px; margin-top:var(--section); }
.footer__grid{ display:grid; gap:24px; justify-items:center; text-align:center; }
.footer__mark{ display:grid; justify-items:center; gap:10px; }
.footer__mark svg{ width:64px; height:auto; }
.footer__copy{ font-size:13px; color:rgba(255,255,255,.75); }
@media (max-width:1023px){ .footer__touch{ order:1; } .pays{ order:2; } .footer__legal{ order:3; } .footer__mark{ order:4; margin-top:12px; } }
.footer__touch{ display:grid; justify-items:center; gap:12px; }
.footer__touch p{ font-size:15px; font-weight:500; }
.social{ display:flex; gap:4px; }
.social a{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:#fff; }
.social a:hover{ background:rgba(255,255,255,.14); }
.pays{ direction:ltr; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:16px 26px; }

.pay--visa{ font-style:italic; font-weight:800; font-size:21px; }
.pay--mada{ font-size:15px; flex-direction:column; gap:1px; align-items:flex-start; }

.pay--amex{ font-size:9.5px; font-weight:800; background:#fff; color:var(--forest); padding:6px 5px; border-radius:3px; }
.footer__legal{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px 18px; font-size:12px; }
.footer__legal .sbc{ padding:6px 10px; border:1px solid rgba(255,255,255,.45); border-radius:8px; font-size:11px; }
.footer__legal .ids{ display:grid; gap:2px; text-align:start; }
@media (min-width:1024px){
  .footer__grid{ grid-template-columns:1fr 1fr; justify-items:stretch; text-align:start; row-gap:32px; }
  .footer__mark{ grid-column:1; grid-row:1; justify-items:start; }
  .footer__touch{ grid-column:2; grid-row:1; justify-items:end; }
  .pays, .footer__legal{ grid-column:1 / -1; justify-self:center; }
}
.wa{ position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); inset-inline-start:16px; z-index:54; width:54px; height:54px; border-radius:50%; background:var(--lime); color:#0B0B0B; display:grid; place-items:center; box-shadow:0 8px 24px rgba(0,0,0,.18); text-decoration:none; }
.toast{ position:fixed; z-index:310; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); background:var(--invert); color:var(--on-invert); padding:12px 18px; border-radius:var(--r-pill); font-size:14px; max-width:calc(100vw - 32px); width:max-content; text-align:center; opacity:0; visibility:hidden; transition:all .45s var(--ease); }
.toast.is-on{ opacity:1; visibility:visible; transform:translate(-50%, 0); }

@media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
</style>

<body>
<a class="skip" href="#q" data-t="skip"></a>

<!-- INTRO: "Hello! 👋", a typed welcome, three dots, and the dots become the search bar (once per visit) -->
<div class="intro" id="intro">
  <div class="intro__wrap" id="introWrap">
    <div class="intro__hello" id="introHello" aria-hidden="true"></div>

  <div class="intro__pill" id="introPill" aria-hidden="true"></div>

</div>

<div class="announce" role="region" aria-label="Announcements"><div class="marquee" id="marquee"></div></div>

<header class="header" id="header">
  <div class="container header__inner">
    <div class="header__start">
      <button class="icon-btn" id="searchBtn" data-t-aria="search"></button>
      <nav class="nav" id="nav" aria-label="Departments"></nav>
    </div>
    <a href="ket-home.html" class="logo" aria-label="ket" id="logo"></a>

      <button class="lang-btn latin" id="langBtn">EN</button>
    </div>
  </div>
</header>

<main id="main">
  <!-- 1. HERO: greeting + smart search -->
  <section class="hero container" aria-labelledby="heroH">
    <div class="hero__in">
      <div class="greet" id="greet"><span class="wave is-on" aria-hidden="true">👋🏼</span><span class="greet__txt" id="greetTxt"></span></div>
      <h1 class="hero__h" id="heroH" data-t="heroH"></h1>
      <p class="hero__tx" data-t="heroTx"></p>
      <form class="sbox" id="sbox" role="search" autocomplete="off">
        <span class="sbox__tip" id="sTip" data-t="idleTip" aria-hidden="true"></span>
        <div class="sbox__frame">
          <div class="sbox__field" id="sField">

<script>
(() => {
'use strict';
const $ = (s, c = document) => c.querySelector(s);
const $$ = (s, c = document) => [...c.querySelectorAll(s)];
const root = document.documentElement;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const G = !!(window.gsap && window.ScrollTrigger) && !reduce;
root.classList.add(G ? 'motion' : 'no-motion');
const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
if (G) gsap.registerPlugin(ScrollTrigger);
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

let lang = 'ar';
const t = (k, v) => { let s = STORE.ui[lang][k] ?? k; if (v && typeof s === 'string') for (const x in v) s = s.replace(`{${x}}`, v[x]); return s; };
const L = o => (o && typeof o === 'object' && 'ar' in o) ? o[lang] : o;
const fmt = n => n.toLocaleString('en-US');
const cur = () => STORE.currency[lang];
const img = p => `media/${p}.webp`;
const P = STORE.products, byId = Object.fromEntries(P.map(p => [p.id, p]));
const catOf = id => STORE.cats.find(c => c.id === id);
const off = (was, price) => Math.round((1 - price / was) * 100);
ICON.arrow = '<path d="M5 12h14M13 6l6 6-6 6"/>';
ICON.moon = '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>';
ICON.sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>';
ICON.play = '<path d="M8 5.5v13l11-6.5-11-6.5Z" fill="currentColor"/>';
ICON.cartplus = '<path d="M2.5 4h2l2.2 11h11.8l2-8H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>';

/* ---------------- static chrome ---------------- */
$('#searchBtn').innerHTML = icon('search');
$('#accountBtn').innerHTML = icon('user');
$('#cartBtn').insertAdjacentHTML('afterbegin', icon('bag'));
$('#logo').innerHTML = logo(64);
$('#footerSmile').innerHTML = smileMark(64);
$('#wa').innerHTML = icon('wa', 28);
$('#sClear').innerHTML = icon('close', 18, 1.8);
$('#sGoIco').innerHTML = icon('search', 20, 2);
// "previous" points back: the arrow is mirrored on a wrapper so the RTL flip on the svg still applies
$('#carPrev').innerHTML = `<span style="display:block;transform:scaleX(-1)">${icon('arrow', 20, 1.8)}</span>`;
$('#carNext').innerHTML = icon('arrow', 20, 1.8);
$('#icoIg').innerHTML = icon('ig', 20, 1.8);
$('#icoTt').innerHTML = icon('tiktok', 20, 1.8);
$('#lnkIg').href = STORE.links.instagram; $('#lnkTt').href = STORE.links.tiktok;
$('#social').innerHTML = [['snap', 'Snapchat'], ['ig', 'Instagram'], ['tiktok', 'TikTok'], ['wa', 'WhatsApp'], ['mail', 'Email'], ['globe', 'Website']].map(([i, n]) => `<a href="#" data-toast="soon" aria-label="${n}">${icon(i, 20)}</a>`).join('');
const grp = () => `<div class="marquee__group">${[1, 2, 3, 1, 2, 3].map(i => `<span data-t="ann${i}"></span>`).join('')}</div>`;
$('#marquee').innerHTML = grp() + grp().replace('class="marquee__group"', 'class="marquee__group" aria-hidden="true"');

/* ---------------- theme (light / dark) ---------------- */
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const paintTheme = () => { const d = isDark(); $('#themeBtn').innerHTML = icon(d ? 'sun' : 'moon', 21, 1.6); $('#themeBtn').setAttribute('aria-pressed', d); };
$('#themeBtn').onclick = () => { root.dataset.theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('ketTheme', root.dataset.theme); } catch (e) {} paintTheme(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme);
paintTheme();

/* ---------------- cart + toast ---------------- */
let cart = 0, tt;
const toast = m => { const el = $('#toast'); el.textContent = m; el.classList.add('is-on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('is-on'), 2400); };
const addToCart = () => { cart++; const c = $('#cartCount'); c.textContent = cart; c.classList.add('has-items'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); toast(t('added')); };
document.addEventListener('click', e => { const a = e.target.closest('[data-toast]'); if (a) { e.preventDefault(); toast(t(a.dataset.toast)); } });
const openProduct = p => { if (p.url) location.href = p.url; else if (p.cat === 'tables') location.href = 'ket-tables.html'; else toast(t('prodSoon')); };
const openCat = c => { if (c.url) location.href = c.url; else toast(t('soon')); };

/* ======================================================================
   SEARCH: real matches from the store's products and departments, by name
   (Arabic spelling variants are folded together) or by product number.
   ====================================================================== */
const norm = s => String(s).toLowerCase()
  .replace(/[ً-ٰٟـ]/g, '')            // tashkeel + tatweel
  .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/ڤ/g, 'ف').replace(/گ/g, 'ك')
  .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
  .replace(/[‎‏‏‎|_\-–]/g, ' ').replace(/\s+/g, ' ').trim();
const IDX = P.map(p => ({ p, ar: norm(p.ar), en: norm(p.en), sku: p.sku ? norm(p.sku).replace(/\s/g, '') : '', cat: catOf(p.cat) }));
STORE.cats.forEach(c => { c.n = P.filter(p => p.cat === c.id).length; c.kwN = [...c.kw.map(norm), norm(c.ar), norm(c.en)]; });

function search(qRaw) {
  const q = norm(qRaw); if (!q) return { cats: [], prods: [], num: false };
  const words = q.split(' ').filter(w => w.length > 0);
  const qc = q.replace(/\s/g, '');
  const num = /\d/.test(q) && /^[a-z]*\s?\d/.test(q);
  // departments whose name or keywords match any word
  const cats = STORE.cats.filter(c => words.some(w => c.kwN.some(k => k.startsWith(w) || (w.length > 2 && k.includes(w)) || (w.length > 3 && w.includes(k)))));
  const scored = [];
  for (const it of IDX) {
    let s = 0;
    if (it.sku && (it.sku.includes(qc) || qc.includes(it.sku))) s += 100;
    for (const w of words) {
      const hay = it.ar + ' ' + it.en;
      if (it.ar.startsWith(w) || it.en.startsWith(w)) s += 12;
      else if (hay.split(' ').some(x => x.startsWith(w))) s += 9;
      else if (w.length > 1 && hay.includes(w)) s += 5;
    }
    if (cats.includes(it.cat)) s += 4;
    if (s) scored.push([s, it.p]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  return { cats, prods: scored.map(x => x[1]), num };
}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function mark(name, qRaw) {
  const words = norm(qRaw).split(' ').filter(w => w.length > 0); if (!words.length) return esc(name);
  // highlight on the normalised string, mapped back to the original characters
  const map = []; let n = '';
  [...name].forEach((ch, i) => { const c = norm(ch) || (ch === ' ' ? ' ' : ''); for (const x of c) { n += x; map.push(i); } });
  const hits = new Array(name.length).fill(false);
  words.forEach(w => { let k = n.indexOf(w); while (k > -1 && w) { for (let j = k; j < k + w.length; j++) hits[map[j]] = true; k = n.indexOf(w, k + w.length); } });
  let out = '', on = false;
  [...name].forEach((ch, i) => { if (hits[i] && !on) { out += '<mark>'; on = true; } if (!hits[i] && on) { out += '</mark>'; on = false; } out += esc(ch); });
  return out + (on ? '</mark>' : '');
}
const priceHTML = p => p.price ? `<span class="srow__p">${fmt(p.price)}<em>${cur()}</em>${p.was ? `<s>${fmt(p.was)}</s>` : ''}</span>` : '<span></span>';
const rowHTML = (p, qRaw, i) => `<button class="srow" type="button" role="option" data-pid="${p.id}" data-i="${i}">
  <span class="srow__img"><img src="${img(p.img)}" alt="" loading="lazy"></span>
  <span><b>${mark(L(p), qRaw)}</b><small>${L(catOf(p.cat))}${p.sku ? ` · <span class="latin">${p.sku}</span>` : ''}</small></span>${priceHTML(p)}</button>`;

const sbox = $('#sbox'), q = $('#q'), sres = $('#sres');
let act = -1;
function renderRes() {
  const v = q.value; sbox.classList.toggle('has-text', !!v);
  let h = '';
  if (!v.trim()) {
    h = `<h4>${t('sTrend')}</h4><div class="sres__chips">${t('trend').map(x => `<button class="chip" type="button" data-q="${x}">${icon('search', 14, 2)}${x}</button>`).join('')}</div>
      <h4>${t('sPick')}</h4>${['tc', 't03', 'lp03', 'tr06'].map((id, i) => rowHTML(byId[id], '', i)).join('')}`;
  } else {
    const r = search(v);
    if (r.cats.length) h += `<h4>${t('sCats')}</h4><div class="sres__chips">${r.cats.map(c => `<button class="chip" type="button" data-cat="${c.id}">${L(c)} <span class="latin" style="opacity:.55">${c.n}</span></button>`).join('')}</div>`;
    if (r.prods.length) h += `<h4>${t('sProds')}</h4>${r.prods.slice(0, 6).map((p, i) => rowHTML(p, v, i)).join('')}${r.prods.length > 6 ? `<button class="sres__all" type="button" data-all>${t('sAll', { n: r.prods.length })}</button>` : ''}`;
    if (!h) h = `<p class="sres__none">${r.num ? t('sNoneNo') : t('sNone')}</p>`;
  }
  sres.innerHTML = h; act = -1;
}
const openRes = () => { renderRes(); sbox.classList.add('is-open'); q.setAttribute('aria-expanded', 'true'); };
const closeRes = () => { sbox.classList.remove('is-open'); q.setAttribute('aria-expanded', 'false'); };
q.addEventListener('focus', () => { sbox.classList.add('is-focus'); openRes(); stopIdle(); if (innerWidth < 768 && lenis) lenis.scrollTo(sbox, { offset: -90, duration: .8 }); });
q.addEventListener('blur', () => sbox.classList.remove('is-focus'));
q.addEventListener('input', () => { openRes(); stopIdle(); });
$('#sClear').onclick = () => { q.value = ''; q.focus(); renderRes(); };
document.addEventListener('pointerdown', e => { if (!sbox.contains(e.target)) closeRes(); });
q.addEventListener('keydown', e => {
  const rows = $$('.srow, .chip, .sres__all', sres);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!rows.length) return; act = (act + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length; rows.forEach((r, i) => r.classList.toggle('is-act', i === act)); rows[act].scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'Escape') { closeRes(); q.blur(); }
});
sbox.addEventListener('submit', e => {
  e.preventDefault();
  const rows = $$('.srow, .chip, .sres__all', sres);
  if (act > -1 && rows[act]) { rows[act].click(); return; }
  const r = search(q.value);
  if (r.prods.length === 1 || (r.prods[0] && byId[r.prods[0].id].sku && norm(q.value).replace(/\s/g, '').includes(norm(byId[r.prods[0].id].sku).replace(/\s/g, '')))) openProduct(r.prods[0]);
  else if (r.cats.length) openCat(r.cats[0]);
  else { openRes(); q.focus(); }
});
sres.addEventListener('click', e => {
  const c = e.target.closest('[data-q]'), k = e.target.closest('[data-cat]'), p = e.target.closest('[data-pid]'), a = e.target.closest('[data-all]');
  if (c) { q.value = c.dataset.q; q.focus(); renderRes(); }
  else if (k) openCat(catOf(k.dataset.cat));
  else if (p) openProduct(byId[p.dataset.pid]);
  else if (a) { const r = search(q.value); openCat(r.cats[0] || catOf(r.prods[0].cat)); }
});
$('#searchBtn').onclick = () => { const go = () => setTimeout(() => q.focus({ preventScroll: true }), 50); if (lenis) { lenis.scrollTo(0, { duration: 1 }); setTimeout(go, 700); } else { scrollTo({ top: 0, behavior: 'smooth' }); go(); } };

/* typed hints inside the empty box */
let phI = 0, phTimer;
function typeHints() {
  clearTimeout(phTimer);
  const el = $('#sPh'), list = t('ph');
  const s = list[phI % list.length]; let i = 0, back = false;
  const step = () => {
    if (!back) { i++; el.innerHTML = esc(s.slice(0, i)) + '<span class="caret"></span>'; if (i >= s.length) { back = true; phTimer = setTimeout(step, 1900); return; } phTimer = setTimeout(step, 55 + Math.random() * 40); }
    else { i -= 2; el.innerHTML = esc(s.slice(0, Math.max(0, i))) + '<span class="caret"></span>'; if (i <= 0) { phI++; phTimer = setTimeout(typeHints, 350); return; } phTimer = setTimeout(step, 22); }
  };
  if (reduce) { el.textContent = s; return; }
  step();
}
/* idle: no touch, scroll or typing for a while → the light speeds up and a small hint pops up */
let idleT;
const stopIdle = () => { sbox.classList.remove('is-idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!q.value && document.activeElement !== q && scrollY < innerHeight * .6) sbox.classList.add('is-idle'); }, 7000); };
['pointermove', 'keydown', 'scroll', 'touchstart'].forEach(ev => addEventListener(ev, stopIdle, { passive: true }));

/* greeting chip: the Saudi welcome lines take turns */
let gI = 0;
function cycleGreet() {
  const el = $('#greetTxt'), g = t('greets');
  const show = () => { el.textContent = g[gI % g.length]; };
  if (G) gsap.to(el, { y: -10, opacity: 0, duration: .3, ease: 'power2.in', onComplete: () => { gI++; show(); gsap.fromTo(el, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: 'back.out(2)' }); } });
  else { gI++; show(); }
}

/* the product strip at the bottom of the hero: mostly white tiles, a few green and pink */
const RIBBON = ['t03', 'lp03', 'tr06', 'ac03', 't12', 'rg04', 'lp11', 'ac05', 'tr03', 't01', 'lp08', 'ac08', 't17', 'tr01'];
const RB_TINT = { 1: 'l', 3: 'p', 6: 'l', 10: 'l', 12: 'p' };
function renderRibbon() {
  const g = hide => `<div class="ribbon__g"${hide ? ' aria-hidden="true"' : ''}>${RIBBON.map((id, i) => { const p = byId[id];
    return `<a class="rb${RB_TINT[i] ? ' rb--' + RB_TINT[i] : ''}" href="#" data-pid="${id}"${hide ? ' tabindex="-1"' : ''} aria-label="${L(p)}"><img src="${img(p.img)}" alt="" loading="lazy"><span class="rb__p">${p.price ? `${fmt(p.price)} ${cur()}` : L(catOf(p.cat))}</span></a>`; }).join('')}</div>`;
  $('#ribbonTrack').innerHTML = g(false) + g(true);
}
$('#ribbon').addEventListener('click', e => { const a = e.target.closest('[data-pid]'); if (a) { e.preventDefault(); openProduct(byId[a.dataset.pid]); } });

/* ======================================================================
   2. ABOUT: three statements, one at a time; each has a highlighted
   word (green mark or pink) and its own product picture
   ====================================================================== */
const STORY_ART = [['t03', 'c', 'var(--lime)'], ['lp03', 'a', 'var(--tile)'], ['tr03', 'p', 'var(--pink)']];
const HL = ['hl-m', 'hl-p', 'hl-m'];
const words = s => s ? s.split(' ').map(w => `<span class="wm"><span class="wi">${w}</span></span>`).join(' ') : '';
function renderStory() {
  $('#storySlides').innerHTML = t('st').map(([a, h, b], i) => `<p class="ss" data-s="${i}">${words(a)} <span class="${HL[i]}">${words(h)}</span> ${words(b)}</p>`).join('');
  $('#storyArt').innerHTML = STORY_ART.map(([id, sh, bg], i) => { const p = byId[id];
    return `<div class="sa" data-s="${i}"><div class="sa__t sh-${sh}" style="--bg-t:${bg}"><img src="${img(p.img)}" alt="${L(p)}" loading="lazy"></div>
      <a class="sa__chip" href="#" data-pid="${id}"><i class="flip">${icon('arrow', 16, 2)}</i><span>${L(p)}<small>${fmt(p.price)} ${cur()}</small></span></a></div>`; }).join('');
}

// midnight in Riyadh (UTC+3), tonight
const riyadhMidnight = () => { const now = Date.now(), r = new Date(now + 3 * 3600e3); r.setUTCHours(24, 0, 0, 0); return r.getTime() - 3 * 3600e3; };
const DEALS = STORE.clearance.map(d => ({ ...d, p: byId[d.id], ends: d.ends ? Date.parse(d.ends) : d.hours ? Math.min(riyadhMidnight(), Date.now() + d.hours * 3600e3 - 17 * 60e3) : riyadhMidnight() }));
const pad = n => String(n).padStart(2, '0');
const split = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60]; };
const live = () => DEALS.filter(d => d.ends > Date.now());
let deals = live(), pos = 0;
function renderClock() {
  const [h, m, s] = split(riyadhMidnight() - Date.now());
  $('#clock').innerHTML = [[h, 'hrs'], [m, 'min'], [s, 'sec']].map(([v, k], i) => `${i ? '<span class="clock__sep">:</span>' : ''}<span class="clock__u"><b>${pad(v)}</b><small>${t(k)}</small></span>`).join('');
}

function renderDeals() {

const wrapD = (i, n) => { let d = ((i % n) + n) % n; if (d > n / 2) d -= n; return d; };
function layout() {
  const n = deals.length, cards = $$('.dl', $('#track')); if (!n) return;
  const w = cards[0].offsetWidth, mob = innerWidth < 640, sp = w * (mob ? .74 : .66), dirX = lang === 'ar' ? -1 : 1;
  cards.forEach((el, i) => {
    const d = wrapD(i - pos, n), a = Math.abs(d);
    const x = d * sp * dirX, z = -a * (mob ? 120 : 170), ry = Math.max(-55, Math.min(55, -d * dirX * 26)), sc = 1 - Math.min(a, 3) * .05;
    el.style.transform = `translate3d(${x}px,0,${z}px) rotateY(${ry}deg) scale(${sc})`;
    el.style.zIndex = 100 - Math.round(a * 10);
    el.style.opacity = a > 2.6 ? 0 : 1;
    el.style.setProperty('--dim', Math.min(.55, a * .3));
    el.style.pointerEvents = a > 2.4 ? 'none' : '';

}
let posTw;
function goTo(target, dur = .8) {
  if (posTw) posTw.kill();
  if (G) posTw = gsap.to({ v: pos }, { v: target, duration: dur, ease: 'expo.out', onUpdate() { pos = this.targets()[0].v; layout(); } });
  else { pos = target; layout(); }
}
function tickDeals() {
  $$('.dl__time').forEach(el => { const [h, m, s] = split(+el.dataset.ends - Date.now()); el.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`; });

// drag / swipe
(() => {
  const car = $('#car'); let x0 = 0, p0 = 0, drag = false, moved = 0, lastX = 0, lastT = 0, vel = 0;
  car.addEventListener('pointerdown', e => { if (e.button) return; drag = true; moved = 0; x0 = lastX = e.clientX; lastT = performance.now(); p0 = pos; vel = 0; if (posTw) posTw.kill(); car.classList.add('is-drag'); stopAuto(); });
  addEventListener('pointermove', e => {
    if (!drag) return; const sp = ($('.dl')?.offsetWidth || 300) * (innerWidth < 640 ? .74 : .66), dirX = lang === 'ar' ? -1 : 1;
    const dx = e.clientX - x0; moved = Math.max(moved, Math.abs(dx));
    const now = performance.now(); vel = (e.clientX - lastX) / Math.max(1, now - lastT); lastX = e.clientX; lastT = now;
    pos = p0 - dx / sp * dirX; layout();
  });
  addEventListener('pointerup', () => {
    if (!drag) return; drag = false; car.classList.remove('is-drag');
    const dirX = lang === 'ar' ? -1 : 1; goTo(Math.round(pos - vel * 2.2 * dirX)); startAuto();
  });
  car.addEventListener('click', e => {
    if (moved > 6) { e.preventDefault(); e.stopPropagation(); return; }
    const b = e.target.closest('[data-buy]'); if (b) { addToCart(); return; }
    const c = e.target.closest('.dl'); if (!c) return;
    const n = deals.length, d = wrapD(+c.dataset.i - pos, n); if (Math.abs(d) > .5) goTo(pos + d); else openProduct(byId[deals[+c.dataset.i].id]);
  }, true);

  car.addEventListener('wheel', e => { if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 8) { e.preventDefault(); goTo(Math.round(pos) + Math.sign(e.deltaX) * (lang === 'ar' ? -1 : 1), .7); } }, { passive: false });

(() => {
  const rail = $('#vrail'); let i = 0, hold = 0, seen = false;
  ['pointerdown', 'pointerenter', 'wheel', 'touchstart'].forEach(ev => rail.addEventListener(ev, () => { hold = Date.now(); }, { passive: true }));

const vis = (() => { const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  const now = Math.round(60 + 70 * Math.sin(Math.PI * Math.max(0, h - 8) / 16) + Math.random() * 25);
  const week = Math.round(((d.getDay() + 1) % 7 || 7) * 1480 + h * 58 + Math.random() * 90);
  const month = Math.round((d.getDate() - 1) * 1530 + week * .35 + h * 60 + 2400);
  return { month, week, now }; })();
const visShown = { month: 0, week: 0, now: 0 };

setInterval(() => { vis.now = Math.max(30, Math.min(260, vis.now + Math.round((Math.random() - .45) * 7))); if (Math.random() < .6) { vis.week += 1; vis.month += 1; } if (visShown.now) { Object.assign(visShown, vis); paintVis(); } }, 3000);

/* ---------------- motion ---------------- */
let lenis = null, storyST = [];
function storyMotion() {
  storyST.forEach(s => s.kill()); storyST = [];
  const S = $$('.ss'), A = $$('.sa'), bars = $$('#stBars i');
  const wi = i => $$('.wi', S[i]), hl = i => $('.hl-m', S[i]);
  S.forEach((s, i) => { gsap.set(wi(i), { yPercent: i ? 110 : 0 }); if (hl(i)) gsap.set(hl(i), { '--hs': i ? '0%' : '100%' }); });
  A.forEach((a, i) => gsap.set(a, { opacity: i ? 0 : 1, scale: i ? .7 : 1, rotate: 0 }));
  bars.forEach(b => b.style.setProperty('--p', 0));
  // the first statement arrives as the section comes up
  // (it moves the wrappers, so it never fights the scroll timeline below, which moves the words themselves)
  const first = gsap.timeline({ scrollTrigger: { trigger: '#story', start: 'top 75%', toggleActions: 'play none none reverse' } })
    .from(S[0], { y: 60, opacity: 0, duration: 1, ease: 'expo.out' })
    .from($('.sa__t', A[0]), { scale: .6, rotate: -12, duration: 1.1, ease: 'back.out(1.6)' }, 0)
    .from($('.sa__chip', A[0]), { y: 20, opacity: 0, duration: .7, ease: 'back.out(2)' }, .4);
  storyST.push(first.scrollTrigger);
  // then the scroll swaps them: 1 → 2 → 3
  const tl = gsap.timeline({ scrollTrigger: { trigger: '#story', start: 'top top', end: 'bottom bottom', scrub: .8,
    onUpdate: st => { const n = Math.min(2, Math.floor(st.progress * 3)); $('#stN').textContent = '0' + (n + 1); } } });
  [0, 1, 2].forEach(i => tl.fromTo(bars[i], { '--p': 0 }, { '--p': 1, duration: 1, ease: 'none' }, i));
  [1, 2].forEach(i => {
    const at = i - .2;
    tl.to(wi(i - 1), { yPercent: -110, duration: .25, stagger: .01, ease: 'power2.in' }, at)
      .to(A[i - 1], { opacity: 0, scale: .7, rotate: 12, duration: .3, ease: 'power2.in' }, at);
    if (hl(i - 1)) tl.to(hl(i - 1), { '--hs': '0%', duration: .2, ease: 'power2.in' }, at);
    tl.to(wi(i), { yPercent: 0, duration: .35, stagger: .015, ease: 'power3.out' }, at + .25)
      .fromTo(A[i], { opacity: 0, scale: .7, rotate: -12 }, { opacity: 1, scale: 1, rotate: 0, duration: .4, ease: 'back.out(1.5)', immediateRender: false }, at + .22);
    if (hl(i)) tl.to(hl(i), { '--hs': '100%', duration: .3, ease: 'power2.inOut' }, at + .45);
  });
  storyST.push(tl.scrollTrigger);
}
function scrollMotion() {
  if (!G) return;
  gsap.from('.cat', { clearProps: 'transform,opacity', y: 70, opacity: 0, duration: 1, stagger: .08, ease: 'power3.out', scrollTrigger: { trigger: '#catGrid', start: 'top 85%' } });
  gsap.from('#catH, #cats .eyebrow', { y: 30, opacity: 0, duration: .9, stagger: .08, ease: 'power3.out', scrollTrigger: { trigger: '#cats', start: 'top 85%' } });
  gsap.from('.clr', { clipPath: 'inset(6% 4% 6% 4% round 48px)', duration: 1.3, ease: 'power3.out', scrollTrigger: { trigger: '#deals', start: 'top 85%' } });
  gsap.from('.clock__u', { y: 30, opacity: 0, rotateX: -60, duration: .9, stagger: .1, ease: 'back.out(1.8)', scrollTrigger: { trigger: '#clock', start: 'top 90%' } });
  gsap.from('#track', { x: () => (lang === 'ar' ? -1 : 1) * innerWidth * .5, opacity: 0, duration: 1.4, ease: 'expo.out', scrollTrigger: { trigger: '#car', start: 'top 85%' } });
  gsap.from('.vc', { clearProps: 'transform,opacity', y: 80, rotate: (i) => (i % 2 ? 4 : -4), opacity: 0, duration: 1.1, stagger: .07, ease: 'power3.out', scrollTrigger: { trigger: '#vrail', start: 'top 88%' } });
  gsap.from('.soc', { clearProps: 'transform,opacity', y: 20, opacity: 0, duration: .8, stagger: .1, ease: 'back.out(2)', scrollTrigger: { trigger: '#exp', start: 'top 80%' } });
  ScrollTrigger.create({ trigger: '.stats', start: 'top 85%', once: true, onEnter: () => gsap.to(visShown, { month: vis.month, week: vis.week, now: vis.now, duration: 2.2, ease: 'power3.out', onUpdate: paintVis }) });
  gsap.from('.vis', { y: 60, opacity: 0, duration: 1.1, ease: 'power3.out', scrollTrigger: { trigger: '.vis', start: 'top 88%' } });
}

/* ---------------- the intro ---------------- */
function heroIn(t0 = 0) {
  if (!G) return;
  gsap.timeline({ delay: t0 })
    .from('#greet', { y: 20, opacity: 0, scale: .9, duration: .8, ease: 'back.out(2)' }, 0)
    .from('#heroH', { y: 40, opacity: 0, duration: 1, ease: 'expo.out' }, .05)
    .from('.hero__tx', { y: 24, opacity: 0, duration: .9, ease: 'expo.out' }, .15)
    .from('#heroChips', { y: 16, opacity: 0, duration: .7, ease: 'back.out(2)', clearProps: 'transform,opacity' }, .3)
    .from('#ribbon', { y: 60, opacity: 0, duration: 1.2, ease: 'expo.out', clearProps: 'transform,opacity' }, .3)
    .from('#logo .klogo__word', { y: 30, opacity: 0, duration: .9, ease: 'back.out(1.7)' }, 0);
}
function done() {
  root.classList.remove('is-intro');
  try { sessionStorage.setItem('ketHello', '1'); } catch (e) {}
  if (lenis) lenis.start();
  scrollMotion(); stopIdle();
  setInterval(cycleGreet, 3800);
  if (G) ScrollTrigger.refresh();
}
function runIntro() {
  scrollTo(0, 0);
  let seen = false; try { seen = !!sessionStorage.getItem('ketHello'); } catch (e) {}
  if (!G) { done(); return; }
  const hello = t('hello'), line = t('helloLine');
  $('#introHello').innerHTML = [...hello].map(c => `<span class="ch">${c}</span>`).join('') + '<span class="wave">👋🏼</span>';
  const typed = { n: 0 };
  const tl = gsap.timeline({ onComplete: finish });
  const box = () => $('#sField').getBoundingClientRect();
  if (!seen) {
    tl.from('#introHello .ch', { y: 80, opacity: 0, duration: .9, stagger: .06, ease: 'expo.out' }, .1)
      .from('#introHello .wave', { scale: 0, rotate: -40, duration: .8, ease: 'back.out(2.4)', onComplete: () => $('#introHello .wave').classList.add('is-on') }, .45)
      .to(typed, { n: line.length, duration: Math.min(1.6, line.length * .045), ease: 'none', onUpdate: () => { $('#introLine').innerHTML = esc(line.slice(0, Math.round(typed.n))) + '<span class="caret"></span>'; } }, 1.05)
      .to('#introWrap', { y: -40, opacity: 0, duration: .55, ease: 'power2.in' }, '+=.75');
  }
  tl.to('#introDots', { opacity: 1, duration: .3, onStart: () => $('#introDots').classList.add('is-on') }, seen ? .15 : '>-.05')
    .to({}, { duration: seen ? .55 : .9 })
    .add(() => $('#introDots').classList.remove('is-on'))
    .to('#introDots i:nth-child(1)', { x: () => -box().width * .18, duration: .45, ease: 'power3.inOut' })
    .to('#introDots i:nth-child(3)', { x: () => box().width * .18, duration: .45, ease: 'power3.inOut' }, '<')
    .set('#introPill', { opacity: 1 })
    .to('#introSkip', { opacity: 0, duration: .3 }, '<')
    .to('#introDots i', { x: 0, scale: .2, opacity: 0, duration: .35, ease: 'power3.in' })
    .to('#introPill', { width: () => box().width, height: () => box().height, left: () => box().left, top: () => box().top, margin: 0, duration: .9, ease: 'expo.inOut' }, '<.1')
    .to('#intro', { backgroundColor: 'rgba(0,0,0,0)', duration: .5 }, '-=.25')
    .add(() => heroIn(0), '-=.5')
    .to('#introPill', { opacity: 0, duration: .35 });
  function finish() { done(); }
  $('#introSkip').onclick = () => { tl.progress(1); };
}

/* ---------------- boot ---------------- */
renderScene();
applyLang();
setInterval(() => { renderClock(); tickDeals(); }, 1000);
if (G && window.Lenis) {
  lenis = new Lenis({ lerp: .11, smoothWheel: true });
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add(time => lenis.raf(time * 1000)); gsap.ticker.lagSmoothing(0);
  lenis.stop();
}
startAuto();
const fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 1200))]).then(runIntro);
})();
</script>
</body>
</html>
